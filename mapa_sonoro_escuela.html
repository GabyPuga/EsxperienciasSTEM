<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa sonoro de nuestra escuela · STEM+</title>
<style>
/* ============================================================
   MAPA SONORO DE NUESTRA ESCUELA — STEM+
   Ministerio de Educación · Ciudad Autónoma de Buenos Aires
   Aplicación de archivo único (HTML + CSS + JS)
   ------------------------------------------------------------
   Verde, amarillo y rojo se usan SOLO para el nivel de sonido.
   Los espacios del croquis usan tonos fríos y neutros.
   ============================================================ */

:root{
  --ba-amarillo:#FFD100;
  --ba-amarillo-osc:#E5B900;
  --ba-tinta:#1B1F2A;
  --ba-gris:#5A6472;
  --ba-acento:#2A5FC4;        /* azul institucional: acciones y selección */
  --ba-acento-osc:#1D4694;
  --ba-fondo:#F5F7FA;
  --ba-blanco:#FFFFFF;
  --ba-borde:#D8DEE7;
  --verde-bg:#D8F5E1;   --verde-bd:#2E9E5B;  --verde-tx:#14603A;
  --amar-bg:#FFF1C7;    --amar-bd:#E2A100;   --amar-tx:#7A5200;
  --rojo-bg:#FFDADA;    --rojo-bd:#D64545;   --rojo-tx:#8C1F1F;
  --radio:14px;
  --sombra:0 2px 6px rgba(27,31,42,.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--ba-fondo);
  color:var(--ba-tinta);
  font-size:17px;
  line-height:1.35;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}

/* ---------- Encabezado ---------- */
header.titulo{
  background:var(--ba-blanco);border-bottom:4px solid var(--ba-amarillo);
  padding:10px 18px 9px;display:flex;align-items:center;gap:16px;
}
header.titulo .logo{height:62px;width:auto;flex:none;}
header.titulo h1{margin:0;font-size:25px;line-height:1.15;}
header.titulo p{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--ba-gris);}
@media (max-width:600px){
  header.titulo{gap:12px;}
  header.titulo .logo{height:48px;}
  header.titulo h1{font-size:21px;}
}

/* ---------- Pestañas de pisos ---------- */
.pisos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px 0;}
.piso-tab{
  display:flex;align-items:center;gap:7px;
  background:var(--ba-blanco);border:2px solid var(--ba-borde);
  border-radius:12px 12px 0 0;padding:9px 14px;font-size:16px;font-weight:700;
  color:var(--ba-gris);cursor:pointer;
}
.piso-tab[aria-selected="true"]{
  background:var(--ba-acento);border-color:var(--ba-acento-osc);color:#fff;
}
.piso-tab .marcador{font-size:12px;font-weight:600;opacity:.85;}
.piso-add{
  background:transparent;border:2px dashed var(--ba-borde);border-radius:12px;
  padding:9px 14px;font-size:16px;font-weight:700;color:var(--ba-gris);cursor:pointer;
}
.piso-add:hover{border-color:var(--ba-acento);color:var(--ba-acento);}
.piso-acciones{margin-left:auto;display:flex;gap:8px;}

/* ---------- Botones ---------- */
.btn{
  border:2px solid var(--ba-borde);background:var(--ba-blanco);color:var(--ba-tinta);
  border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sombra);
}
.btn:hover{border-color:var(--ba-acento);}
.btn:focus-visible{outline:3px solid var(--ba-acento);outline-offset:2px;}
.btn.chico{padding:7px 12px;font-size:14px;border-radius:10px;}
.btn.primario{background:var(--ba-amarillo);border-color:var(--ba-amarillo-osc);}
.btn.peligro{color:#8C1F1F;border-color:#E7C3C3;background:#FCF6F6;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Barra de espacios ---------- */
.barra{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  margin:0 18px 12px;padding:11px 12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  box-shadow:var(--sombra);
}
.barra .rotulo{font-weight:800;font-size:15px;color:var(--ba-gris);margin-right:2px;}
.espacio-btn{
  border:2px solid var(--ba-borde);background:var(--ba-blanco);
  border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;
  color:var(--ba-tinta);
}
.espacio-btn:hover{border-color:var(--ba-acento);transform:translateY(-1px);}

/* ---------- Zona principal ---------- */
.zona{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 18px 22px;align-items:start;}
@media (max-width:1000px){ .zona{grid-template-columns:1fr;} }

.lienzo-wrap{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);overflow:hidden;position:relative;padding:6px;
}
.lienzo-escala{position:relative;width:100%;margin:0 auto;overflow:hidden;}
.lienzo{
  position:absolute;top:0;left:0;width:1200px;height:640px;
  transform-origin:top left;
  background-color:#FCFDFE;
  background-image:
    linear-gradient(to right,rgba(90,100,114,.07) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(90,100,114,.07) 1px,transparent 1px);
  background-size:40px 40px;
  touch-action:none;
}
.vacio{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  color:#93A0B0;font-size:21px;font-weight:700;pointer-events:none;padding:20px;
}
.vacio small{display:block;font-size:16px;font-weight:600;margin-top:8px;color:#A9B4C2;}

/* ---------- Bloques ---------- */
.bloque{
  position:absolute;border:3px solid #B9C4D3;border-radius:12px;background:#fff;
  cursor:grab;user-select:none;touch-action:none;box-shadow:0 1px 3px rgba(27,31,42,.10);
}
.bloque:active{cursor:grabbing;}
.bloque.sel{border-color:var(--ba-acento);box-shadow:0 0 0 4px rgba(42,95,196,.20);}
.bloque .contenido{
  width:100%;height:100%;overflow:hidden;border-radius:9px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px;
}
.bloque .nombre{
  font-weight:800;font-size:17px;text-align:center;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.1;max-width:100%;word-break:break-word;
}
.bloque .medidas{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%;}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;border:2px solid;white-space:nowrap;}
.chip.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.chip.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.chip.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}

.tirador{
  position:absolute;width:18px;height:18px;background:#fff;
  border:3px solid var(--ba-acento);border-radius:50%;
  box-shadow:0 1px 3px rgba(27,31,42,.25);z-index:5;touch-action:none;
}
.tirador[data-dir="nw"]{left:-12px;top:-12px;cursor:nwse-resize;}
.tirador[data-dir="ne"]{right:-12px;top:-12px;cursor:nesw-resize;}
.tirador[data-dir="sw"]{left:-12px;bottom:-12px;cursor:nesw-resize;}
.tirador[data-dir="se"]{right:-12px;bottom:-12px;cursor:nwse-resize;}
.tirador[data-dir="n"]{left:50%;top:-12px;margin-left:-12px;cursor:ns-resize;}
.tirador[data-dir="s"]{left:50%;bottom:-12px;margin-left:-12px;cursor:ns-resize;}
.tirador[data-dir="w"]{top:50%;left:-12px;margin-top:-12px;cursor:ew-resize;}
.tirador[data-dir="e"]{top:50%;right:-12px;margin-top:-12px;cursor:ew-resize;}

/* ---------- Panel lateral ---------- */
.panel{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px;position:sticky;top:12px;
}
.panel h2{margin:0 0 10px;font-size:20px;}
.panel h3{margin:0 0 8px;font-size:16px;color:var(--ba-gris);}
.panel .sub{color:var(--ba-gris);font-size:14px;margin:0 0 14px;}
.fila-nombre{display:flex;gap:6px;align-items:center;}
.fila-nombre input{
  flex:1;min-width:0;padding:9px 10px;font-size:15px;border:2px solid var(--ba-borde);
  border-radius:10px;font-family:inherit;background:#fff;color:var(--ba-tinta);
}
.fila-nombre input:focus{outline:3px solid rgba(42,95,196,.30);border-color:var(--ba-acento);}
.dos-columnas{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;}
.dos-columnas .campo{margin-bottom:0;}
.panel .ayuda{color:var(--ba-gris);font-size:15px;}
.panel ol{margin:8px 0 0;padding-left:20px;color:var(--ba-gris);font-size:15px;}
.panel ol li{margin-bottom:6px;}
.campo{margin-bottom:12px;}
.campo label{display:block;font-weight:700;font-size:14px;margin-bottom:5px;}
.campo input{
  width:100%;padding:10px;font-size:16px;border:2px solid var(--ba-borde);
  border-radius:10px;font-family:inherit;background:#fff;color:var(--ba-tinta);
}
.campo input:focus{outline:3px solid rgba(42,95,196,.30);border-color:var(--ba-acento);}
.rapidos{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.rapidos button{
  border:2px solid var(--ba-borde);background:#fff;border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ba-gris);
}
.rapidos button:hover{border-color:var(--ba-acento);color:var(--ba-acento);}

/* elección de color (la hacen los chicos, no es automática) */
.colores{display:flex;gap:8px;}
.color-btn{
  flex:1;border:3px solid;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:800;
  cursor:pointer;text-align:center;
}
.color-btn.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.color-btn.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.color-btn.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.color-btn[aria-pressed="true"]{
  box-shadow:0 0 0 3px var(--ba-tinta) inset;
}
.escala{margin-top:10px;}
.escala summary{
  cursor:pointer;font-size:14px;font-weight:700;color:var(--ba-acento);list-style:none;
}
.escala summary::-webkit-details-marker{display:none;}
.escala .filas{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;}
.escala .filas span{border:2px solid;border-radius:8px;padding:4px 9px;}

.lista-med{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;}
.lista-med li{display:flex;align-items:center;gap:8px;border:2px solid;border-radius:10px;padding:7px 10px;font-size:15px;}
.lista-med li.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.lista-med li.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.lista-med li.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.lista-med .mom{flex:1;font-weight:700;}
.lista-med .db{font-weight:800;}
.lista-med .quitar{
  border:none;background:rgba(255,255,255,.7);border-radius:50%;width:26px;height:26px;
  font-size:15px;cursor:pointer;color:inherit;font-weight:800;line-height:1;
}
.acciones-bloque{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.separador{height:2px;background:var(--ba-borde);margin:16px 0;border-radius:2px;}

/* ---------- Pie ---------- */
.pie{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 18px 24px;}
.pie .nota{margin-left:auto;color:var(--ba-gris);font-size:13px;}

/* ---------- Aviso emergente ---------- */
.aviso{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);
  background:var(--ba-tinta);color:#fff;padding:12px 20px;border-radius:12px;
  font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  transition:transform .25s ease,opacity .25s ease;z-index:60;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;
}
.aviso.ver{transform:translateX(-50%) translateY(0);opacity:1;}

/* ---------- Impresión ---------- */
#areaImpresion{display:none;}
@media print{
  @page{size:A4 landscape;margin:10mm;}
  body{background:#fff;font-size:12px;}
  .marca,header.titulo,.pisos,.barra,.zona,.pie,.aviso,.no-imprimir{display:none !important;}
  #areaImpresion{display:block;}
  .hoja{page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;}
  .hoja:last-child{page-break-after:auto;break-after:auto;}
  .hoja{position:relative;}
  .hoja h2{font-size:17px;margin:0 0 2px;}
  .hoja .p-logo{position:absolute;top:0;right:0;height:46px;width:auto;}
  .hoja .sello{font-size:10px;color:#555;margin:0 0 6px;}
  .p-lienzo{
    position:relative;width:1200px;height:640px;border:2px solid #999;border-radius:8px;
    transform:scale(.855);transform-origin:top left;background:#fff;
  }
  .p-lienzo-caja{height:548px;overflow:hidden;}
  .p-resumen{margin-top:6px;column-count:4;column-gap:14px;font-size:10px;}
  .p-resumen .t{font-weight:700;font-size:11px;margin-bottom:3px;column-span:all;}
  .p-resumen div.f{break-inside:avoid;border:1px solid #bbb;border-radius:4px;padding:1px 5px;margin-bottom:3px;}
  .bloque{box-shadow:none;}
  .tirador{display:none !important;}
}
</style>
</head>

<script>
/* ============================================================
   1. DATOS
   ============================================================ */
const ANCHO = 1200, ALTO = 640, MIN_W = 90, MIN_H = 70, MAX_PISOS = 4;

/* Tonos fríos y neutros: el verde, el amarillo y el rojo quedan
   reservados exclusivamente para el nivel de sonido. */
const TIPOS = [
  {id:'aula',       nombre:'Aula',       color:'#DEE9F9', borde:'#8FB2DE'},
  {id:'patio',      nombre:'Patio',      color:'#D5EDF2', borde:'#7CBCC8'},
  {id:'pasillo',    nombre:'Pasillo',    color:'#E9E8F6', borde:'#A9A3D2'},
  {id:'comedor',    nombre:'Comedor',    color:'#F4E8F0', borde:'#C79CBB'},
  {id:'biblioteca', nombre:'Biblioteca', color:'#E1E5EC', borde:'#97A5B5'},
  {id:'sum',        nombre:'SUM',        color:'#DFE3F5', borde:'#9AA2D8'},
  {id:'banos',      nombre:'Baños',      color:'#E7EEF2', borde:'#9CB3C0'},
  {id:'direccion',  nombre:'Dirección',  color:'#EDEAE6', borde:'#B7AC9E'},
  {id:'otro',       nombre:'Otro',       color:'#ECEDEF', borde:'#AFB5BC'}
];
const tipoDe = id => TIPOS.find(t => t.id === id) || TIPOS[TIPOS.length-1];

const MOMENTOS = ['Hora de clase','Recreo','Comedor','Entrada','Salida','Educación Física'];

const COLORES = {
  v:{nombre:'Verde',    bg:'#D8F5E1', bd:'#2E9E5B', tx:'#14603A', regla:'hasta 50 dB'},
  a:{nombre:'Amarillo', bg:'#FFF1C7', bd:'#E2A100', tx:'#7A5200', regla:'entre 50 y 70 dB'},
  r:{nombre:'Rojo',     bg:'#FFDADA', bd:'#D64545', tx:'#8C1F1F', regla:'más de 70 dB'}
};

let idc = 1;
const nuevoId = () => 'x' + (idc++) + '-' + Math.floor(Math.random()*10000);

let estado = { pisoActivo:null, seleccion:null, pisos:[] };
let colorElegido = null;   // color que eligen los chicos para la próxima medición

function pisoNuevo(nombre){ return { id:nuevoId(), nombre:nombre, bloques:[] }; }
function inicial(){
  const p = pisoNuevo('Planta baja');
  estado = { pisoActivo:p.id, seleccion:null, pisos:[p] };
  colorElegido = null;
  historial.length = 0;
}
const pisoActual = () => estado.pisos.find(p => p.id === estado.pisoActivo) || estado.pisos[0];
const bloqueSel  = () => { const p = pisoActual(); return p ? p.bloques.find(b => b.id === estado.seleccion) : null; };

/* ============================================================
   2. HISTORIAL (deshacer)
   ============================================================ */
const historial = [];
function guardarPaso(){
  historial.push(JSON.stringify(estado));
  if (historial.length > 40) historial.shift();
  actualizarDeshacer();
}
function deshacer(){
  if (!historial.length) return;
  estado = JSON.parse(historial.pop());
  pintarTodo();
  avisar('Listo, deshice el último cambio');
}
function actualizarDeshacer(){
  document.getElementById('btnDeshacer').disabled = historial.length === 0;
}

/* ============================================================
   3. PESTAÑAS DE PISOS
   ============================================================ */
function pintarPisos(){
  const cont = document.getElementById('pisos');
  cont.innerHTML = '';
  estado.pisos.forEach(p => {
    const b = document.createElement('button');
    b.className = 'piso-tab';
    b.setAttribute('aria-selected', p.id === estado.pisoActivo);
    b.innerHTML = '<span>' + escapar(p.nombre) + '</span>' +
      (p.id === estado.pisoActivo ? '<span class="marcador">cambiar nombre</span>' : '');
    b.onclick = () => {
      if (p.id === estado.pisoActivo){ renombrarPiso(p); return; }
      guardarPaso();
      estado.pisoActivo = p.id;
      estado.seleccion = null;
      pintarTodo();
    };
    cont.appendChild(b);
  });

  if (estado.pisos.length < MAX_PISOS){
    const add = document.createElement('button');
    add.className = 'piso-add';
    add.textContent = '+ Agregar piso';
    add.onclick = agregarPiso;
    cont.appendChild(add);
  }

  const acc = document.createElement('div');
  acc.className = 'piso-acciones';
  acc.innerHTML = '<button class="btn chico" id="dupPiso">Duplicar piso</button>' +
                  '<button class="btn chico peligro" id="delPiso">Borrar piso</button>';
  cont.appendChild(acc);
  document.getElementById('dupPiso').onclick = duplicarPiso;
  document.getElementById('delPiso').onclick = borrarPiso;
  document.getElementById('delPiso').disabled = estado.pisos.length <= 1;
}

function agregarPiso(){
  if (estado.pisos.length >= MAX_PISOS){ avisar('Se pueden crear hasta 4 pisos.'); return; }
  const sugeridos = ['Planta baja','Primer piso','Segundo piso','Tercer piso'];
  guardarPaso();
  const p = pisoNuevo(sugeridos[estado.pisos.length] || ('Piso ' + (estado.pisos.length+1)));
  estado.pisos.push(p);
  estado.pisoActivo = p.id;
  estado.seleccion = null;
  pintarTodo();
  avisar('Piso agregado: ' + p.nombre);
}
function renombrarPiso(p){
  const n = prompt('¿Cómo se llama este piso?', p.nombre);
  if (n === null) return;
  const limpio = n.trim();
  if (!limpio) return;
  guardarPaso();
  p.nombre = limpio.slice(0,30);
  pintarTodo();
}
function duplicarPiso(){
  if (estado.pisos.length >= MAX_PISOS){ avisar('Se pueden crear hasta 4 pisos.'); return; }
  const orig = pisoActual();
  guardarPaso();
  const copia = JSON.parse(JSON.stringify(orig));
  copia.id = nuevoId();
  copia.nombre = (orig.nombre + ' (copia)').slice(0,30);
  copia.bloques.forEach(b => { b.id = nuevoId(); b.medidas.forEach(m => m.id = nuevoId()); });
  estado.pisos.push(copia);
  estado.pisoActivo = copia.id;
  estado.seleccion = null;
  pintarTodo();
  avisar('Piso duplicado');
}
function borrarPiso(){
  if (estado.pisos.length <= 1){ avisar('Tiene que quedar al menos un piso.'); return; }
  const p = pisoActual();
  if (!confirm('¿Seguro que querés borrar "' + p.nombre + '" con todo lo que tiene adentro?')) return;
  guardarPaso();
  estado.pisos = estado.pisos.filter(x => x.id !== p.id);
  estado.pisoActivo = estado.pisos[0].id;
  estado.seleccion = null;
  pintarTodo();
  avisar('Piso borrado');
}

/* ============================================================
   4. BARRA DE ESPACIOS
   ============================================================ */
function pintarBarra(){
  const barra = document.getElementById('barra');
  barra.innerHTML = '';
  const r = document.createElement('span');
  r.className = 'rotulo';
  r.textContent = 'Agregar espacio:';
  barra.appendChild(r);
  TIPOS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'espacio-btn';
    b.style.background = t.color;
    b.style.borderColor = t.borde;
    b.textContent = t.nombre;
    b.onclick = () => agregarBloque(t.id);
    barra.appendChild(b);
  });
}

/* ============================================================
   5. BLOQUES DEL CROQUIS
   ============================================================ */
function agregarBloque(tipoId){
  const t = tipoDe(tipoId);
  const p = pisoActual();
  guardarPaso();
  const n = p.bloques.length;
  const b = {
    id:nuevoId(), tipo:t.id, nombre:t.nombre,
    x:60 + (n % 5) * 210, y:50 + Math.floor(n / 5) * 165,
    w:190, h:140, medidas:[]
  };
  acomodar(b);
  p.bloques.push(b);
  estado.seleccion = b.id;
  pintarTodo();
}

function acomodar(b){
  b.w = Math.max(MIN_W, Math.min(b.w, ANCHO));
  b.h = Math.max(MIN_H, Math.min(b.h, ALTO));
  b.x = Math.max(0, Math.min(b.x, ANCHO - b.w));
  b.y = Math.max(0, Math.min(b.y, ALTO - b.h));
}

function duplicarBloque(){
  const b = bloqueSel(); if (!b) return;
  guardarPaso();
  const copia = JSON.parse(JSON.stringify(b));
  copia.id = nuevoId();
  copia.medidas.forEach(m => m.id = nuevoId());
  copia.x = b.x + 26; copia.y = b.y + 26;
  acomodar(copia);
  pisoActual().bloques.push(copia);
  estado.seleccion = copia.id;
  pintarTodo();
}
function borrarBloque(){
  const b = bloqueSel(); if (!b) return;
  if (!confirm('¿Borrar "' + b.nombre + '"?')) return;
  guardarPaso();
  const p = pisoActual();
  p.bloques = p.bloques.filter(x => x.id !== b.id);
  estado.seleccion = null;
  pintarTodo();
}

function pintarLienzo(){
  const l = document.getElementById('lienzo');
  l.innerHTML = '';
  const p = pisoActual();
  if (!p) return;
  if (!p.bloques.length){
    const v = document.createElement('div');
    v.className = 'vacio';
    v.innerHTML = 'Elegí un espacio en la barra de arriba para empezar' +
      '<small>Después podés moverlo, cambiarle el tamaño y cargar el sonido.</small>';
    l.appendChild(v);
  }
  p.bloques.forEach(b => l.appendChild(crearBloqueEl(b, true)));
}

function crearBloqueEl(b, interactivo){
  const t = tipoDe(b.tipo);
  const seleccionado = interactivo && b.id === estado.seleccion;
  const el = document.createElement('div');
  el.className = 'bloque' + (seleccionado ? ' sel' : '');
  el.dataset.id = b.id;
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.style.width = b.w + 'px';
  el.style.height = b.h + 'px';
  el.style.background = t.color;
  if (!seleccionado) el.style.borderColor = t.borde;

  let interno = '<span class="nombre">' + escapar(b.nombre) + '</span>';
  if (b.medidas.length){
    interno += '<span class="medidas">' + b.medidas.map(m =>
      '<span class="chip ' + m.color + '">' + escapar(m.momento) + ': ' + m.db + ' dB</span>'
    ).join('') + '</span>';
  }
  let html = '<div class="contenido">' + interno + '</div>';
  if (seleccionado){
    ['nw','n','ne','e','se','s','sw','w'].forEach(d => {
      html += '<span class="tirador" data-dir="' + d + '"></span>';
    });
  }
  el.innerHTML = html;
  return el;
}

/* ---------- Arrastrar y redimensionar ---------- */
let escalaActual = 1;
let arrastre = null;

function puntoLienzo(e){
  const r = document.getElementById('lienzo').getBoundingClientRect();
  return { x:(e.clientX - r.left) / escalaActual, y:(e.clientY - r.top) / escalaActual };
}

document.getElementById('lienzo').addEventListener('pointerdown', e => {
  const el = e.target.closest('.bloque');
  if (!el){
    if (estado.seleccion){ estado.seleccion = null; pintarLienzo(); pintarPanel(); }
    return;
  }
  const id = el.dataset.id;
  const tir = e.target.closest('.tirador');

  if (estado.seleccion !== id){
    estado.seleccion = id;
    colorElegido = null;
    pintarLienzo(); pintarPanel();
    if (tir) return;
  }
  const b = pisoActual().bloques.find(x => x.id === id);
  if (!b) return;

  const p = puntoLienzo(e);
  arrastre = {
    id, tipo: tir ? 'medida' : 'mover', dir: tir ? tir.dataset.dir : null,
    px:p.x, py:p.y, ox:b.x, oy:b.y, ow:b.w, oh:b.h,
    antes: JSON.stringify(estado), movio:false
  };
  e.preventDefault();
  document.getElementById('lienzo').setPointerCapture(e.pointerId);
});

document.getElementById('lienzo').addEventListener('pointermove', e => {
  if (!arrastre) return;
  const b = pisoActual().bloques.find(x => x.id === arrastre.id);
  if (!b) return;
  const p = puntoLienzo(e);
  const dx = p.x - arrastre.px, dy = p.y - arrastre.py;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) arrastre.movio = true;

  if (arrastre.tipo === 'mover'){
    b.x = arrastre.ox + dx;
    b.y = arrastre.oy + dy;
  } else {
    const d = arrastre.dir;
    let x = arrastre.ox, y = arrastre.oy, w = arrastre.ow, h = arrastre.oh;
    if (d.includes('e')) w = arrastre.ow + dx;
    if (d.includes('s')) h = arrastre.oh + dy;
    if (d.includes('w')){ w = arrastre.ow - dx; x = arrastre.ox + dx; }
    if (d.includes('n')){ h = arrastre.oh - dy; y = arrastre.oy + dy; }
    if (w < MIN_W){ if (d.includes('w')) x = arrastre.ox + arrastre.ow - MIN_W; w = MIN_W; }
    if (h < MIN_H){ if (d.includes('n')) y = arrastre.oy + arrastre.oh - MIN_H; h = MIN_H; }
    if (x < 0){ w += x; x = 0; }
    if (y < 0){ h += y; y = 0; }
    if (x + w > ANCHO) w = ANCHO - x;
    if (y + h > ALTO)  h = ALTO - y;
    b.x = x; b.y = y; b.w = Math.max(MIN_W, w); b.h = Math.max(MIN_H, h);
  }
  acomodar(b);
  const el = document.querySelector('.bloque[data-id="' + b.id + '"]');
  if (el){
    el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
    el.style.width = b.w + 'px'; el.style.height = b.h + 'px';
  }
});

function finArrastre(){
  if (!arrastre) return;
  if (arrastre.movio){
    historial.push(arrastre.antes);
    if (historial.length > 40) historial.shift();
    actualizarDeshacer();
  }
  arrastre = null;
}
document.getElementById('lienzo').addEventListener('pointerup', finArrastre);
document.getElementById('lienzo').addEventListener('pointercancel', finArrastre);
document.getElementById('lienzo').addEventListener('dblclick', e => {
  const el = e.target.closest('.bloque');
  if (!el) return;
  estado.seleccion = el.dataset.id;
  pintarTodo();
  const inp = document.getElementById('inpNombre');
  if (inp){ inp.focus(); inp.select(); }
});

/* ============================================================
   6. PANEL: el espacio y su sonido, todo junto
   ============================================================ */
function pintarPanel(){
  const panel = document.getElementById('panel');
  const b = bloqueSel();

  if (!b){
    panel.innerHTML =
      '<h2>¿Cómo se usa?</h2>' +
      '<ol>' +
      '<li>Tocá un botón de la barra de arriba para agregar un espacio de la escuela.</li>' +
      '<li>Arrastralo hasta su lugar y estirá los puntitos azules para darle el tamaño.</li>' +
      '<li>Tocá un espacio: acá vas a poder cambiarle el nombre y cargar las mediciones de sonido.</li>' +
      '<li>Si la escuela tiene más pisos, usá <strong>+ Agregar piso</strong>.</li>' +
      '</ol>';
    return;
  }

  let html =
    '<h2>' + escapar(b.nombre) + '</h2>' +
    '<div class="fila-nombre">' +
    '<input id="inpNombre" type="text" maxlength="24" value="' + escapar(b.nombre) + '" title="Nombre del espacio">' +
    '<button class="btn chico" id="btnDup">Duplicar</button>' +
    '<button class="btn chico peligro" id="btnDel">Borrar</button>' +
    '</div>' +
    '<div class="separador"></div>' +
    '<h3>Sonido en este espacio</h3>' +
    '<div class="dos-columnas">' +
      '<div class="campo"><label for="inpMomento">¿Qué momento?</label>' +
      '<input id="inpMomento" type="text" list="listaMomentos" maxlength="24" placeholder="Recreo">' +
      '<datalist id="listaMomentos">' + MOMENTOS.map(m => '<option value="' + m + '">').join('') + '</datalist></div>' +
      '<div class="campo"><label for="inpDb">¿Cuántos dB?</label>' +
      '<input id="inpDb" type="number" min="0" max="140" step="1" placeholder="62"></div>' +
    '</div>' +
    '<div class="rapidos">' + MOMENTOS.slice(0,3).map(m => '<button data-m="' + m + '">' + m + '</button>').join('') + '</div>' +
    '<div class="campo" style="margin-top:12px"><label>¿De qué color le corresponde pintarlo?</label>' +
    '<div class="colores">' +
      ['v','a','r'].map(c =>
        '<button class="color-btn ' + c + '" data-c="' + c + '" aria-pressed="' + (colorElegido === c) + '">' +
        COLORES[c].nombre + '</button>').join('') +
    '</div>' +
    '<details class="escala"><summary>Ver la escala de colores</summary><div class="filas">' +
      ['v','a','r'].map(c =>
        '<span style="background:' + COLORES[c].bg + ';border-color:' + COLORES[c].bd + ';color:' + COLORES[c].tx + '">' +
        COLORES[c].nombre + ': ' + COLORES[c].regla + '</span>').join('') +
    '</div></details></div>' +
    '<button class="btn primario" id="btnAdd" style="width:100%;justify-content:center">Agregar medición</button>';

  if (b.medidas.length){
    html += '<ul class="lista-med">' + b.medidas.map(m =>
      '<li class="' + m.color + '"><span class="mom">' + escapar(m.momento) + '</span>' +
      '<span class="db">' + m.db + ' dB</span>' +
      '<button class="quitar" data-id="' + m.id + '" title="Quitar">&times;</button></li>'
    ).join('') + '</ul>';
  } else {
    html += '<p class="ayuda" style="margin-top:12px">Todavía no hay mediciones en este espacio.</p>';
  }

  panel.innerHTML = html;

  const inpNombre = document.getElementById('inpNombre');
  let previo = null;
  inpNombre.onfocus = () => { previo = JSON.stringify(estado); };
  inpNombre.oninput = () => {
    const bb = bloqueSel(); if (!bb) return;
    bb.nombre = inpNombre.value;
    const el = document.querySelector('.bloque[data-id="' + bb.id + '"] .nombre');
    if (el) el.textContent = bb.nombre;
  };
  inpNombre.onblur = () => {
    const bb = bloqueSel(); if (!bb) return;
    if (!bb.nombre.trim()) bb.nombre = tipoDe(bb.tipo).nombre;
    if (previo && previo !== JSON.stringify(estado)){ historial.push(previo); actualizarDeshacer(); }
    previo = null;
    pintarLienzo();
    const t = document.querySelector('.panel h2');
    if (t) t.textContent = bb.nombre;
    inpNombre.value = bb.nombre;
  };

  document.getElementById('btnDup').onclick = duplicarBloque;
  document.getElementById('btnDel').onclick = borrarBloque;

  document.querySelectorAll('.rapidos button').forEach(btn => {
    btn.onclick = () => {
      document.getElementById('inpMomento').value = btn.dataset.m;
      document.getElementById('inpDb').focus();
    };
  });
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.onclick = () => {
      colorElegido = btn.dataset.c;
      document.querySelectorAll('.color-btn').forEach(o =>
        o.setAttribute('aria-pressed', o.dataset.c === colorElegido));
    };
  });
  document.getElementById('btnAdd').onclick = agregarMedicion;
  document.getElementById('inpDb').onkeydown = e => { if (e.key === 'Enter') agregarMedicion(); };

  document.querySelectorAll('.lista-med .quitar').forEach(btn => {
    btn.onclick = () => {
      const bb = bloqueSel(); if (!bb) return;
      guardarPaso();
      bb.medidas = bb.medidas.filter(m => m.id !== btn.dataset.id);
      pintarLienzo(); pintarPanel();
    };
  });
}

/* Si las mediciones no entran, el espacio crece solo para que se vean todas */
function agrandarSiHaceFalta(b){
  const el = document.querySelector('.bloque[data-id="' + b.id + '"]');
  if (!el) return;
  const dentro = el.querySelector('.contenido');
  let vueltas = 0;
  while (dentro.scrollHeight > dentro.clientHeight + 1 && b.h < ALTO && vueltas++ < 40){
    b.h += 16;
    acomodar(b);
    el.style.top = b.y + 'px';
    el.style.height = b.h + 'px';
  }
}

function agregarMedicion(){
  const b = bloqueSel(); if (!b) return;
  const momento = (document.getElementById('inpMomento').value || '').trim();
  const dbTxt = document.getElementById('inpDb').value;
  if (!momento){ avisar('Escribí en qué momento midieron'); document.getElementById('inpMomento').focus(); return; }
  const db = Math.round(Number(dbTxt));
  if (!dbTxt || isNaN(db) || db < 0 || db > 140){
    avisar('Escribí un número de dB entre 0 y 140');
    document.getElementById('inpDb').focus();
    return;
  }
  if (!colorElegido){ avisar('Elegí de qué color hay que pintarlo'); return; }

  guardarPaso();
  b.medidas.push({ id:nuevoId(), momento:momento.slice(0,24), db:db, color:colorElegido });
  const usado = COLORES[colorElegido].nombre;
  colorElegido = null;
  pintarLienzo();
  agrandarSiHaceFalta(b);
  pintarPanel();
  avisar('Agregado: ' + momento + ' · ' + db + ' dB · ' + usado);
}

/* ============================================================
   7. ESCALA, AVISOS Y UTILIDADES
   ============================================================ */
function ajustarEscala(){
  const caja = document.getElementById('escala');
  caja.style.width = '100%';
  const ancho = caja.clientWidth || ANCHO;
  let s = Math.min(1, ancho / ANCHO);
  const arriba = caja.getBoundingClientRect().top + (window.scrollY || 0);
  const alturaLibre = window.innerHeight - arriba - 92;
  if (window.innerWidth > 1000 && alturaLibre > 240)
    s = Math.max(s * 0.72, Math.min(s, alturaLibre / ALTO));
  escalaActual = Math.max(0.42, s);
  document.getElementById('lienzo').style.transform = 'scale(' + escalaActual + ')';
  caja.style.height = (ALTO * escalaActual) + 'px';
  caja.style.width = (ANCHO * escalaActual) + 'px';
}
window.addEventListener('resize', ajustarEscala);

let avisoT = null;
function avisar(txt){
  const a = document.getElementById('aviso');
  a.textContent = txt;
  a.classList.add('ver');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('ver'), 2200);
}
function escapar(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   8. PIE: deshacer, reiniciar, imprimir
   ============================================================ */
document.getElementById('btnDeshacer').onclick = deshacer;
document.getElementById('btnReiniciar').onclick = () => {
  if (!confirm('¿Querés borrar todo y empezar de nuevo?\nSe van a perder los espacios y las mediciones de todos los pisos.')) return;
  inicial();
  pintarTodo();
  avisar('Proyecto reiniciado');
};
document.getElementById('btnImprimir').onclick = () => { armarImpresion(); window.print(); };
window.addEventListener('beforeprint', armarImpresion);

function armarImpresion(){
  const cont = document.getElementById('areaImpresion');
  cont.innerHTML = '';
  estado.pisos.forEach(p => {
    const hoja = document.createElement('div');
    hoja.className = 'hoja';

    const h = document.createElement('h2');
    h.textContent = 'Mapa sonoro de nuestra escuela — ' + p.nombre;
    hoja.appendChild(h);

    const sello = document.createElement('p');
    sello.className = 'sello';
    sello.textContent = 'Escala de colores: verde hasta 50 dB · amarillo entre 50 y 70 dB · rojo más de 70 dB';
    hoja.appendChild(sello);

    const marca = document.createElement('img');
    marca.className = 'p-logo';
    marca.src = document.querySelector('header.titulo .logo').src;
    marca.alt = 'Experiencias STEM+';
    hoja.appendChild(marca);

    const caja = document.createElement('div');
    caja.className = 'p-lienzo-caja';
    const lz = document.createElement('div');
    lz.className = 'p-lienzo';
    p.bloques.forEach(b => lz.appendChild(crearBloqueEl(b, false)));
    caja.appendChild(lz);
    hoja.appendChild(caja);

    const filas = [];
    p.bloques.forEach(b => b.medidas.forEach(m => filas.push([b.nombre, m.momento, m.db, m.color])));
    if (filas.length){
      const res = document.createElement('div');
      res.className = 'p-resumen';
      res.innerHTML = '<div class="t">Mediciones registradas en ' + escapar(p.nombre) + '</div>' +
        filas.map(f => {
          const c = COLORES[f[3]] || COLORES.v;
          return '<div class="f" style="background:' + c.bg + ';color:' + c.tx + ';border-color:' + c.bd + '">' +
                 '<strong>' + escapar(f[0]) + '</strong> · ' + escapar(f[1]) + ': ' + f[2] + ' dB</div>';
        }).join('');
      hoja.appendChild(res);
    }
    cont.appendChild(hoja);
  });
}

/* ============================================================
   9. ARRANQUE
   ============================================================ */
function pintarTodo(){
  pintarPisos();
  pintarBarra();
  pintarLienzo();
  pintarPanel();
  ajustarEscala();
  actualizarDeshacer();
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); deshacer(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') &&
      estado.seleccion && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault(); borrarBloque();
  }
});

inicial();
pintarTodo();
</script>
