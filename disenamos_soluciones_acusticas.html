<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseñamos soluciones acústicas · STEM+</title>
<style>
/* ============================================================
   DISEÑAMOS SOLUCIONES ACÚSTICAS — STEM+
   Ministerio de Educación · Ciudad Autónoma de Buenos Aires
   Aplicación de archivo único (HTML + CSS + JS)
   ------------------------------------------------------------
   Continúa la familia visual de "Mapa sonoro de nuestra escuela".
   Verde, amarillo y rojo se usan SOLO para el nivel de sonido.
   ============================================================ */

:root{
  --ba-amarillo:#FFD100;
  --ba-amarillo-osc:#E5B900;
  --ba-tinta:#1B1F2A;
  --ba-gris:#5A6472;
  --ba-acento:#2A5FC4;
  --ba-acento-osc:#1D4694;
  --ba-fondo:#F5F7FA;
  --ba-blanco:#FFFFFF;
  --ba-borde:#D8DEE7;
  --verde-bg:#D8F5E1;   --verde-bd:#2E9E5B;  --verde-tx:#14603A;
  --amar-bg:#FFF1C7;    --amar-bd:#E2A100;   --amar-tx:#7A5200;
  --rojo-bg:#FFDADA;    --rojo-bd:#D64545;   --rojo-tx:#8C1F1F;
  --radio:14px;
  --sombra:0 2px 6px rgba(27,31,42,.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--ba-fondo);
  color:var(--ba-tinta);
  font-size:17px;
  line-height:1.35;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}

/* ---------- Encabezado ---------- */
header.titulo{
  background:var(--ba-blanco);border-bottom:4px solid var(--ba-amarillo);
  padding:10px 18px 9px;display:flex;align-items:center;gap:16px;
}
header.titulo .logo{height:62px;width:auto;flex:none;}
header.titulo h1{margin:0;font-size:25px;line-height:1.15;}
header.titulo p{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--ba-gris);}
@media (max-width:600px){
  header.titulo{gap:12px;}
  header.titulo .logo{height:48px;}
  header.titulo h1{font-size:21px;}
}

/* ---------- Pestañas de las tres partes ---------- */
.pisos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px 0;}
.piso-tab{
  display:flex;align-items:center;gap:7px;
  background:var(--ba-blanco);border:2px solid var(--ba-borde);
  border-radius:12px 12px 0 0;padding:9px 14px;font-size:16px;font-weight:700;
  color:var(--ba-gris);cursor:pointer;
}
.piso-tab[aria-selected="true"]{
  background:var(--ba-acento);border-color:var(--ba-acento-osc);color:#fff;
}
.piso-tab .marcador{font-size:12px;font-weight:600;opacity:.85;}
.piso-tab:disabled{opacity:.55;cursor:not-allowed;}
.piso-acciones{margin-left:auto;display:flex;gap:8px;}

/* ---------- Botones ---------- */
.btn{
  border:2px solid var(--ba-borde);background:var(--ba-blanco);color:var(--ba-tinta);
  border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sombra);
}
.btn:hover{border-color:var(--ba-acento);}
.btn:focus-visible{outline:3px solid var(--ba-acento);outline-offset:2px;}
.btn.chico{padding:7px 12px;font-size:14px;border-radius:10px;}
.btn.primario{background:var(--ba-amarillo);border-color:var(--ba-amarillo-osc);}
.btn.peligro{color:#8C1F1F;border-color:#E7C3C3;background:#FCF6F6;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Barras blancas ---------- */
.barra{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  margin:0 18px 12px;padding:11px 12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  box-shadow:var(--sombra);
}
.barra .rotulo{font-weight:800;font-size:15px;color:var(--ba-gris);margin-right:2px;}
.espacio-btn{
  border:2px solid var(--ba-borde);background:var(--ba-blanco);
  border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;
  color:var(--ba-tinta);
}
.espacio-btn:hover{border-color:var(--ba-acento);transform:translateY(-1px);}
.espacio-btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ba-tinta) inset;}

/* ---------- Biblioteca de piezas ---------- */
.biblios{display:flex;gap:12px;margin:0 18px 12px;align-items:stretch;flex-wrap:wrap;}
.biblios > .biblio{margin:0;}
.biblios > #biblioObjetos{flex:1 1 520px;}
.biblios > #biblioMejoras{flex:0 1 356px;}
@media (max-width:900px){ .biblios > #biblioMejoras{flex:1 1 100%;} }
.biblio{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  margin:0 18px 12px;padding:10px 12px 12px;box-shadow:var(--sombra);
}
.biblio.mejoras{border-color:var(--ba-acento);background:#F7FAFF;}
.biblio h2{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--ba-gris);}
.biblio.mejoras h2{color:var(--ba-acento-osc);}
.grupo-piezas{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  border-left:2px solid var(--ba-borde);padding-left:12px;}
.grupo:first-child{border-left:none;padding-left:0;}
.grupo .gnom{font-size:12.5px;font-weight:800;color:var(--ba-gris);text-transform:uppercase;
  letter-spacing:.03em;width:100%;margin-bottom:2px;}
.pieza-btn{
  border:2px solid var(--ba-borde);background:var(--ba-blanco);border-radius:11px;
  padding:4px 6px 3px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ba-tinta);
  display:flex;flex-direction:column;align-items:center;gap:1px;width:76px;line-height:1.1;
  text-align:center;
}
.pieza-btn:hover{border-color:var(--ba-acento);transform:translateY(-1px);}
.pieza-btn svg{width:30px;height:22px;display:block;}
.biblio.mejoras .pieza-btn{border-color:#BBD0F0;}

/* En pantallas bajas (netbooks escolares) todo se compacta un poco */
@media (max-height:800px){
  header.titulo{padding:6px 18px 5px;}
  header.titulo .logo{height:46px;}
  header.titulo h1{font-size:21px;}
  header.titulo p{font-size:13px;}
  .pisos{padding:8px 18px 0;}
  .barra{padding:8px 10px;margin-bottom:9px;}
  .biblio{padding:7px 10px 8px;}
  .biblio h2{margin-bottom:5px;}
  .pieza-btn{width:70px;font-size:11px;padding:3px 5px 2px;}
}

/* ---------- Zona principal ---------- */
.zona{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 18px 22px;align-items:start;}
@media (max-width:1000px){ .zona{grid-template-columns:1fr;} }

.lienzo-wrap{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);overflow:hidden;position:relative;padding:6px;
}
.lienzo-escala{position:relative;width:100%;margin:0 auto;overflow:hidden;}
.lienzo{
  position:absolute;top:0;left:0;width:1200px;height:640px;
  transform-origin:top left;
  background-color:#FCFDFE;
  background-image:
    linear-gradient(to right,rgba(90,100,114,.07) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(90,100,114,.07) 1px,transparent 1px);
  background-size:40px 40px;
  touch-action:none;
}
.vacio{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  color:#93A0B0;font-size:21px;font-weight:700;pointer-events:none;padding:20px;
}
.vacio small{display:block;font-size:16px;font-weight:600;margin-top:8px;color:#A9B4C2;}

/* ---------- Objetos del croquis ---------- */
.obj{position:absolute;cursor:grab;user-select:none;touch-action:none;}
.obj:active{cursor:grabbing;}
.obj .dibujo{width:100%;height:100%;display:block;}
.obj .dibujo svg{width:100%;height:100%;display:block;overflow:visible;}
.obj .dibujo svg *{vector-effect:non-scaling-stroke;}
.obj .rotulo-obj{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;text-align:center;padding:6px;pointer-events:none;
  color:var(--ba-tinta);word-break:break-word;line-height:1.1;
}
.obj .marco{position:absolute;inset:-5px;border:3px solid var(--ba-acento);border-radius:10px;
  box-shadow:0 0 0 4px rgba(42,95,196,.18);pointer-events:none;}

.tirador{
  position:absolute;width:18px;height:18px;background:#fff;
  border:3px solid var(--ba-acento);border-radius:50%;
  box-shadow:0 1px 3px rgba(27,31,42,.25);z-index:5;touch-action:none;
}
.tirador[data-dir="nw"]{left:-12px;top:-12px;cursor:nwse-resize;}
.tirador[data-dir="ne"]{right:-12px;top:-12px;cursor:nesw-resize;}
.tirador[data-dir="sw"]{left:-12px;bottom:-12px;cursor:nesw-resize;}
.tirador[data-dir="se"]{right:-12px;bottom:-12px;cursor:nwse-resize;}
.tirador[data-dir="n"]{left:50%;top:-12px;margin-left:-12px;cursor:ns-resize;}
.tirador[data-dir="s"]{left:50%;bottom:-12px;margin-left:-12px;cursor:ns-resize;}
.tirador[data-dir="w"]{top:50%;left:-12px;margin-top:-12px;cursor:ew-resize;}
.tirador[data-dir="e"]{top:50%;right:-12px;margin-top:-12px;cursor:ew-resize;}

/* ---------- Panel lateral ---------- */
.panel{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px;position:sticky;top:12px;
}
.panel h2{margin:0 0 10px;font-size:20px;}
.panel h3{margin:0 0 8px;font-size:16px;color:var(--ba-gris);}
.panel .sub{color:var(--ba-gris);font-size:14px;margin:0 0 14px;}
.panel .ayuda{color:var(--ba-gris);font-size:15px;}
.panel ol{margin:8px 0 0;padding-left:20px;color:var(--ba-gris);font-size:15px;}
.panel ol li{margin-bottom:6px;}
.campo{margin-bottom:12px;}
.campo label{display:block;font-weight:700;font-size:14px;margin-bottom:5px;}
.campo input,.campo textarea,.campo select{
  width:100%;padding:10px;font-size:16px;border:2px solid var(--ba-borde);
  border-radius:10px;font-family:inherit;background:#fff;color:var(--ba-tinta);
}
.campo textarea{resize:vertical;min-height:74px;line-height:1.35;}
.campo input:focus,.campo textarea:focus,.campo select:focus{
  outline:3px solid rgba(42,95,196,.30);border-color:var(--ba-acento);}
.campo p.sub{font-size:13.5px;color:var(--ba-gris);font-weight:600;}
.campo .cuenta{font-size:12px;color:var(--ba-gris);text-align:right;margin-top:3px;font-weight:600;}
.dos-columnas{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;}
.dos-columnas .campo{margin-bottom:0;}
.rapidos{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.rapidos button{
  border:2px solid var(--ba-borde);background:#fff;border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ba-gris);
}
.rapidos button:hover{border-color:var(--ba-acento);color:var(--ba-acento);}
.acciones-bloque{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.separador{height:2px;background:var(--ba-borde);margin:16px 0;border-radius:2px;}

/* ---------- Balde de pintura ---------- */
.colores-relleno{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px;}
.color-sw{
  height:34px;border:2px solid #98A3B2;border-radius:9px;cursor:pointer;padding:0;
}
.color-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ba-tinta);}
.color-sw:focus-visible{outline:3px solid var(--ba-acento);outline-offset:2px;}

/* ---------- Escala de sonido (igual que en el mapa sonoro) ---------- */
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;border:2px solid;white-space:nowrap;}
.chip.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.chip.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.chip.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.colores{display:flex;gap:8px;}
.color-btn{
  flex:1;border:3px solid;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:800;
  cursor:pointer;text-align:center;
}
.color-btn.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.color-btn.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.color-btn.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.color-btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ba-tinta) inset;}
.escala{margin-top:10px;}
.escala summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--ba-acento);list-style:none;}
.escala summary::-webkit-details-marker{display:none;}
.escala .filas{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;}
.escala .filas span{border:2px solid;border-radius:8px;padding:4px 9px;}
.lista-med{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;}
.lista-med li{display:flex;align-items:center;gap:8px;border:2px solid;border-radius:10px;padding:7px 10px;font-size:15px;}
.lista-med li.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.lista-med li.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.lista-med li.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.lista-med .mom{flex:1;font-weight:700;}
.lista-med .db{font-weight:800;}
.lista-med .quitar{
  border:none;background:rgba(255,255,255,.7);border-radius:50%;width:26px;height:26px;
  font-size:15px;cursor:pointer;color:inherit;font-weight:800;line-height:1;
}

/* ---------- Parte 2: formulario ---------- */
.formulario{max-width:980px;margin:0 auto;padding:0 18px 22px;}
.tarjeta{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px 18px 18px;margin-bottom:16px;
}
.tarjeta > h2{
  margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px;
}
.tarjeta > h2 .num{
  background:var(--ba-amarillo);border:2px solid var(--ba-amarillo-osc);border-radius:50%;
  width:32px;height:32px;display:grid;place-content:center;font-size:16px;flex:none;
}
.tarjeta > p.sub{color:var(--ba-gris);font-size:14.5px;margin:0 0 14px;}
.mitades{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:720px){ .mitades{grid-template-columns:1fr;} }
.croquis-mini{
  border:2px solid var(--ba-borde);border-radius:12px;background:#fff;overflow:hidden;
  position:relative;
}
.croquis-mini .escena{transform-origin:top left;position:absolute;top:0;left:0;background:#fff;}
.croquis-mini .sinCroquis{
  display:grid;place-content:center;text-align:center;color:#93A0B0;font-weight:700;
  font-size:16px;padding:24px;height:100%;
}

/* ---------- Parte 3: plantillas ---------- */
.zona-poster{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 18px 22px;align-items:start;}
@media (max-width:1000px){ .zona-poster{grid-template-columns:1fr;} }
.poster-wrap{
  background:var(--ba-blanco);border:2px solid var(--ba-borde);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:10px;overflow:hidden;
}
.poster-escala{position:relative;margin:0 auto;overflow:hidden;}
.plantillas{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.plantilla-btn{
  border:2px solid var(--ba-borde);background:#fff;border-radius:12px;padding:8px;
  cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ba-gris);text-align:center;
}
.plantilla-btn:hover{border-color:var(--ba-acento);}
.plantilla-btn[aria-pressed="true"]{border-color:var(--ba-acento);box-shadow:0 0 0 3px rgba(42,95,196,.20);color:var(--ba-tinta);}
.plantilla-btn svg{width:100%;height:64px;display:block;margin-bottom:5px;}
.paletas{display:flex;flex-direction:column;gap:7px;}
.paleta-btn{
  border:2px solid var(--ba-borde);background:#fff;border-radius:12px;padding:6px 8px;
  cursor:pointer;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;
  color:var(--ba-gris);text-align:left;
}
.paleta-btn:hover{border-color:var(--ba-acento);}
.paleta-btn[aria-pressed="true"]{border-color:var(--ba-acento);box-shadow:0 0 0 3px rgba(42,95,196,.20);color:var(--ba-tinta);}
.paleta-btn .tiras{display:flex;flex:none;border-radius:6px;overflow:hidden;border:1px solid #C3CBD6;}
.paleta-btn .tiras i{width:15px;height:22px;display:block;}
.tamano-img{display:flex;gap:8px;align-items:center;margin-top:6px;}
.tamano-img .btn{flex:none;}
.tamano-img .val{font-weight:800;font-size:14px;color:var(--ba-gris);flex:1;text-align:center;}

/* ---------- Pie ---------- */
.pie{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 18px 24px;}
.pie .nota{margin-left:auto;color:var(--ba-gris);font-size:13px;}

/* ---------- Aviso emergente ---------- */
.aviso{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);
  background:var(--ba-tinta);color:#fff;padding:12px 20px;border-radius:12px;
  font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  transition:transform .25s ease,opacity .25s ease;z-index:60;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;
}
.aviso.ver{transform:translateX(-50%) translateY(0);opacity:1;}


/* ============================================================
   PÓSTER (A4 vertical: 720 x 1018 px)
   Cada plantilla tiene su paleta fija. Los estudiantes no la cambian.
   ============================================================ */
.poster{
  width:720px;height:1018px;background:#fff;position:absolute;top:0;left:0;
  transform-origin:top left;display:flex;flex-direction:column;overflow:hidden;
  color:#1B1F2A;font-size:13px;
  --c1:#2A2F63; --tc1:#fff; --c2:#3E6D9C; --tc2:#fff; --c3:#5FB0C9; --tc3:#1B1F2A;
  --cL:#A7E0DB; --cB:#E3F6F5; --cFuerte:#2A2F63; --thL:transparent;
}

.poster .p-cab{
  background:var(--c1);color:var(--tc1);padding:14px 18px 12px;display:flex;align-items:center;gap:14px;
  border-bottom:7px solid var(--cL);flex:none;
}
.poster .p-cab h1{margin:0;font-size:25px;line-height:1.1;letter-spacing:.01em;}
.poster .p-cab p{margin:4px 0 0;font-size:13px;font-weight:700;opacity:.92;}
.poster .p-cab .p-logo{height:52px;width:auto;margin-left:auto;flex:none;background:#fff;
  border-radius:8px;padding:3px 6px;}

.poster .p-cuerpo{
  flex:1;display:grid;gap:10px;padding:12px;min-height:0;
}
.poster .p-bloque{
  background:#fff;border:2px solid var(--cB);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0;min-width:0;cursor:grab;touch-action:none;
}
.poster .p-bloque:active{cursor:grabbing;}
.poster .p-bloque > .th{
  color:#fff;padding:5px 10px;font-size:12.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.03em;flex:none;display:flex;align-items:center;gap:6px;
  border-bottom:2px solid var(--thL);
}
.poster .p-bloque[data-b="problema"]      > .th{background:var(--c2);color:var(--tc2);}
.poster .p-bloque[data-b="investigacion"] > .th{background:var(--c3);color:var(--tc3);}
.poster .p-bloque[data-b="croquis"]       > .th{background:var(--c1);color:var(--tc1);}
.poster .p-bloque[data-b="propuesta"]     > .th{background:var(--c2);color:var(--tc2);}
.poster .p-bloque[data-b="acuerdos"]      > .th{background:var(--c3);color:var(--tc3);}
.poster .p-bloque > .tc{
  flex:1;min-height:0;padding:8px 10px 9px;overflow:hidden;background:#fff;
}
.poster .p-bloque > .tc.es-croquis{padding:5px;}
.poster .p-bloque .et{
  font-size:.85em;font-weight:800;color:#3D4653;text-transform:uppercase;letter-spacing:.03em;
  margin:0 0 1px;
}
.poster .p-bloque p.tx{margin:0 0 7px;line-height:1.32;white-space:pre-wrap;}
.poster .p-bloque p.tx:last-child{margin-bottom:0;}
.poster .p-bloque .vacio-tx{color:#96A0AD;font-style:italic;}
.poster .p-medidas{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px;}
.poster .chip{font-size:.85em;padding:1px 8px;}
.poster .p-lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.poster .p-lista li{
  border-left:5px solid var(--cFuerte);background:#F7F8FA;border-radius:0 7px 7px 0;
  padding:4px 8px;line-height:1.3;
}
.poster .p-croquis{width:100%;height:100%;position:relative;background:#fff;overflow:hidden;}
.poster .p-croquis .escena{position:absolute;top:0;left:0;transform-origin:top left;background:#fff;}
.poster .p-croquis .sinCroquis{display:grid;place-content:center;height:100%;color:#96A0AD;
  font-weight:700;text-align:center;padding:14px;}
.poster .p-destacados{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;}
.poster .p-destacados .d{
  border:2px solid;border-radius:9px;padding:3px 10px 4px;text-align:center;min-width:76px;
}
.poster .p-destacados .d b{display:block;font-size:21px;line-height:1.05;}
.poster .p-destacados .d span{font-size:10px;font-weight:700;display:block;}
.poster .p-destacados .d.v{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-tx);}
.poster .p-destacados .d.a{background:var(--amar-bg);border-color:var(--amar-bd);color:var(--amar-tx);}
.poster .p-destacados .d.r{background:var(--rojo-bg);border-color:var(--rojo-bd);color:var(--rojo-tx);}
.poster .p-destacados .dtx{flex:1;min-width:150px;line-height:1.3;}
.poster .p-pie{
  flex:none;border-top:5px solid var(--cL);background:#fff;color:#3A4350;
  padding:7px 18px 9px;display:flex;gap:12px;align-items:center;font-size:11.5px;font-weight:700;
}
.poster .p-pie .esc{margin-left:auto;color:var(--cFuerte);font-weight:800;}

/* estados de arrastre en el póster */
.poster .p-bloque.arrastrando{opacity:.55;}
.poster .p-bloque.destino{outline:4px solid var(--ba-acento);outline-offset:-2px;}
.poster.no-tocar .p-bloque{cursor:default;}

/* ---------- Impresión ---------- */
#areaImpresion{display:none;}
@media print{
  @page{size:A4 portrait;margin:10mm;}
  body{background:#fff;}
  header.titulo,.pisos,.barra,.biblio,.zona,.zona-poster,.formulario,.pie,.aviso,.no-imprimir{
    display:none !important;
  }
  #areaImpresion{display:block;}
  #areaImpresion .poster{position:relative;transform:scale(.995);transform-origin:top left;}
}
</style>
</head>

   ============================================================ */
const historial = [];
function guardarPaso(){
  historial.push(JSON.stringify(estado));
  if (historial.length > 40) historial.shift();
  actualizarDeshacer();
}
function deshacer(){
  if (!historial.length) return;
  estado = JSON.parse(historial.pop());
  seleccion = null;
  pintarTodo();
  avisar('Listo, deshice el último cambio');
}
function actualizarDeshacer(){
  const b = document.getElementById('btnDeshacer');
  if (b) b.disabled = historial.length === 0;
}

/* ============================================================
   5. GUARDADO AUTOMÁTICO EN EL DISPOSITIVO
   ============================================================ */
const CLAVE = 'stemplus_soluciones_acusticas_v1';
let guardadoT = null;
function guardar(){
  clearTimeout(guardadoT);
  guardadoT = setTimeout(() => {
    try{
      localStorage.setItem(CLAVE, JSON.stringify(estado));
      const n = document.getElementById('notaGuardado');
      if (n) n.textContent = 'Guardado en esta computadora · ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){
      const n = document.getElementById('notaGuardado');
      if (n) n.textContent = 'Esta computadora no permite guardar solo: usá "Guardar archivo del proyecto".';
    }
  }, 400);
}
function recuperar(){
  try{
    const txt = localStorage.getItem(CLAVE);
    if (!txt) return null;
    const d = JSON.parse(txt);
    if (d && d.objetos && d.datos) return d;
  }catch(e){}
  return null;
}
function completarEstado(d){
  const base = estadoInicial();
  const e = Object.assign(base, d);
  e.espacio = Object.assign(base.espacio, d.espacio || {});
  e.datos   = Object.assign(base.datos, d.datos || {});
  if (!Array.isArray(e.datos.recomendaciones) || e.datos.recomendaciones.length < 3)
    e.datos.recomendaciones = ['','',''];
  if (!Array.isArray(e.datos.mediciones)) e.datos.mediciones = [];
  e.poster  = Object.assign(base.poster, d.poster || {});
  e.objetos = Array.isArray(d.objetos) ? d.objetos : [];
  return e;
}

/* Archivo del proyecto */
function descargarProyecto(){
  const nombre = 'soluciones-acusticas' +
    (estado.espacio.nombre ? '-' + estado.espacio.nombre.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-') : '') + '.json';
  const blob = new Blob([JSON.stringify(estado, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  avisar('Archivo del proyecto descargado');
}
function abrirProyecto(archivo){
  const lector = new FileReader();
  lector.onload = () => {
    try{
      const d = JSON.parse(lector.result);
      if (!d || !d.objetos || !d.datos) throw new Error('formato');
      guardarPaso();
      estado = completarEstado(d);
      seleccion = null;
      pintarTodo(); guardar();
      avisar('Proyecto abierto');
    }catch(e){
      avisar('Ese archivo no es un proyecto de esta aplicación');
    }
  };
  lector.readAsText(archivo);
}

  const a = document.getElementById('aviso');

function escapar(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    b.style.borderColor = t.borde;

    b.onclick = () => elegirEspacio(t);

  if (estado.espacio.tipo){
    const n = document.createElement('span');
    n.className = 'rotulo';
    n.style.marginLeft = '6px';

    c.className = 'btn chico';
    c.textContent = 'cambiar nombre';
    c.onclick = renombrarEspacio;
    barra.appendChild(c);
  }
}

function elegirEspacio(t){
  guardarPaso();
  estado.espacio.tipo = t.id;
  if (t.id === 'otro'){
    const n = prompt('¿Qué espacio es?', estado.espacio.nombre || '');
    estado.espacio.nombre = (n && n.trim()) ? n.trim().slice(0,28) : 'Otro espacio';
  } else {
    estado.espacio.nombre = t.nombre;
  }
  pintarTodo(); guardar();
  avisar('Espacio elegido: ' + estado.espacio.nombre);
}
function renombrarEspacio(){
  const n = prompt('¿Cómo se llama este espacio?', estado.espacio.nombre);
  if (n === null) return;
  const limpio = n.trim();
  if (!limpio) return;
  guardarPaso();
  estado.espacio.nombre = limpio.slice(0,28);
  pintarTodo(); guardar();
}

    PIEZAS.filter(p => p.grupo === g).forEach(p => caja.appendChild(botonPieza(p)));
    fila.appendChild(caja);
  });
  cont.appendChild(fila);

  const mej = document.getElementById('biblioMejoras');
  mej.innerHTML = '<h2>Piezas para proponer mejoras acústicas</h2>';
  const fila2 = document.createElement('div');
  fila2.className = 'grupo-piezas';

  caja.className = 'grupo';
  PIEZAS.filter(p => p.fam === 'mejora').forEach(p => caja.appendChild(botonPieza(p)));
  fila2.appendChild(caja);
  mej.appendChild(fila2);
}

function agregarPieza(tipoId){
  if (!estado.espacio.tipo){
    avisar('Primero elegí qué espacio van a mejorar');
    return;
  }
  const p = piezaDe(tipoId);
  guardarPaso();
  const n = estado.objetos.length;
  const o = {
    id:nuevoId(), tipo:p.id,
    x: 70 + (n % 5) * 195, y: 60 + (Math.floor(n / 5) % 3) * 175,
    w: p.w, h: p.h, rot:0, esp:1, esv:1,
    color: '#FFFFFF',
    texto: p.texto ? '' : null
  };
  acomodar(o);
  estado.objetos.push(o);
  seleccion = o.id;
  pintarLienzo(); pintarPanel1(); guardar();
}

const objSel = () => estado.objetos.find(o => o.id === seleccion) || null;

function acomodar(o){
  o.w = Math.max(MIN_W, Math.min(o.w, ANCHO));
  o.h = Math.max(MIN_H, Math.min(o.h, ALTO));
  o.x = Math.max(-o.w/2, Math.min(o.x, ANCHO - o.w/2));
  o.y = Math.max(-o.h/2, Math.min(o.y, ALTO - o.h/2));
}

function duplicarObjeto(){
  const o = objSel(); if (!o) return;
  guardarPaso();
  const c = JSON.parse(JSON.stringify(o));
  c.id = nuevoId(); c.x = o.x + 26; c.y = o.y + 26;
  acomodar(c);
  estado.objetos.push(c);
  seleccion = c.id;
  pintarLienzo(); pintarPanel1(); guardar();
}
function borrarObjeto(){
  const o = objSel(); if (!o) return;
  guardarPaso();
  estado.objetos = estado.objetos.filter(x => x.id !== o.id);
  seleccion = null;
  pintarLienzo(); pintarPanel1(); guardar();
  avisar('Pieza borrada. Si te equivocaste, usá Deshacer.');
}
function girarObjeto(grados){
  const o = objSel(); if (!o) return;
  guardarPaso();
  o.rot = ((o.rot || 0) + grados + 360) % 360;
  pintarLienzo(); pintarPanel1(); guardar();
}
function reflejar(eje){
  const o = objSel(); if (!o) return;
  guardarPaso();
  if (eje === 'h') o.esp = (o.esp || 1) * -1;
  else o.esv = (o.esv || 1) * -1;
  pintarLienzo(); guardar();
}
function pintarObjeto(hex){
  const o = objSel(); if (!o) return;
  guardarPaso();
  o.color = hex;
  pintarLienzo(); pintarPanel1(); guardar();
}

function escenaHTML(){
  /* Croquis dibujado sin controles: se usa en la Parte 2 y en el póster */
  let h = '';

  return h;
}
function htmlObjeto(o, interactivo){
  const p = piezaDe(o.tipo);
  const sel = interactivo && o.id === seleccion;
  const t = 'rotate(' + (o.rot || 0) + 'deg) scale(' + (o.esp || 1) + ',' + (o.esv || 1) + ')';
  let dentro = '<div class="dibujo">' + dibujoDe(p, o.color) + '</div>';
  if (p.texto) dentro += '<div class="rotulo-obj">' + escapar(o.texto || '') + '</div>';
  if (sel){
    dentro += '<div class="marco"></div>';
    ['nw','n','ne','e','se','s','sw','w'].forEach(d => {
      dentro += '<span class="tirador" data-dir="' + d + '"></span>';
    });
  }
  return '<div class="obj' + (sel ? ' sel' : '') + '" data-id="' + o.id + '" style="left:' + o.x +
         'px;top:' + o.y + 'px;width:' + o.w + 'px;height:' + o.h + 'px;transform:' + t + '">' +
         dentro + '</div>';
}

function pintarLienzo(){
  const l = document.getElementById('lienzo');
  let html = '';
  if (!estado.objetos.length){
    html += '<div class="vacio">' +
      (estado.espacio.tipo
        ? 'Elegí una pieza de la biblioteca para empezar'
        : 'Primero decí arriba qué espacio van a mejorar') +
      '<small>Después podés moverla, cambiarle el tamaño, girarla y pintarla.</small></div>';
  }
  estado.objetos.forEach(o => { html += htmlObjeto(o, true); });
  l.innerHTML = html;
}

/* ---------- Arrastrar, redimensionar ---------- */
let escalaActual = 1;
let arrastre = null;

function puntoLienzo(e){
  const r = document.getElementById('lienzo').getBoundingClientRect();
  return { x:(e.clientX - r.left) / escalaActual, y:(e.clientY - r.top) / escalaActual };
}
function girarVector(dx, dy, grados){
  const a = grados * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return { x: dx * c + dy * s, y: -dx * s + dy * c };
}

const lienzoEl = () => document.getElementById('lienzo');

lienzoEl().addEventListener('pointerdown', e => {
  const el = e.target.closest('.obj');
  if (!el){
    if (seleccion){ seleccion = null; pintarLienzo(); pintarPanel1(); }
    return;
  }
  const id = el.dataset.id;
  const tir = e.target.closest('.tirador');
  if (seleccion !== id){
    seleccion = id;
    pintarLienzo(); pintarPanel1();
    if (tir) return;
  }
  const o = estado.objetos.find(x => x.id === id);
  if (!o) return;
  const p = puntoLienzo(e);
  arrastre = {
    id, tipo: tir ? 'medida' : 'mover', dir: tir ? tir.dataset.dir : null,
    px:p.x, py:p.y, ox:o.x, oy:o.y, ow:o.w, oh:o.h, rot:o.rot || 0,
    antes: JSON.stringify(estado), movio:false
  };
  e.preventDefault();
  lienzoEl().setPointerCapture(e.pointerId);
});

lienzoEl().addEventListener('pointermove', e => {
  if (!arrastre) return;
  const o = estado.objetos.find(x => x.id === arrastre.id);
  if (!o) return;
  const p = puntoLienzo(e);
  const dx = p.x - arrastre.px, dy = p.y - arrastre.py;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) arrastre.movio = true;

  if (arrastre.tipo === 'mover'){
    o.x = arrastre.ox + dx;
    o.y = arrastre.oy + dy;
  } else {
    /* el tamaño se calcula en el sistema del objeto (por si está girado) */
    const l = girarVector(dx, dy, arrastre.rot);
    const d = arrastre.dir;
    let dIzq = 0, dArr = 0, dW = 0, dH = 0;
    if (d.includes('e')) dW = l.x;
    if (d.includes('w')){ dW = -l.x; dIzq = l.x; }
    if (d.includes('s')) dH = l.y;
    if (d.includes('n')){ dH = -l.y; dArr = l.y; }
    let w = arrastre.ow + dW, h = arrastre.oh + dH;
    if (w < MIN_W){ if (d.includes('w')) dIzq = arrastre.ow - MIN_W; w = MIN_W; }
    if (h < MIN_H){ if (d.includes('n')) dArr = arrastre.oh - MIN_H; h = MIN_H; }
    w = Math.min(w, ANCHO * 1.2); h = Math.min(h, ALTO * 1.2);
    /* el centro se corre para que la punta opuesta quede quieta */
    const cLocal = { x: dIzq + (w - arrastre.ow) / 2, y: dArr + (h - arrastre.oh) / 2 };
    const cGlobal = girarVector(cLocal.x, cLocal.y, -arrastre.rot);
    const cx = arrastre.ox + arrastre.ow / 2 + cGlobal.x;
    const cy = arrastre.oy + arrastre.oh / 2 + cGlobal.y;
    o.w = w; o.h = h;
    o.x = cx - w / 2;
    o.y = cy - h / 2;
  }
  acomodar(o);
  const el = document.querySelector('.obj[data-id="' + o.id + '"]');
  if (el){
    el.style.left = o.x + 'px'; el.style.top = o.y + 'px';
    el.style.width = o.w + 'px'; el.style.height = o.h + 'px';
  }
});

function finArrastre(){
  if (!arrastre) return;
  if (arrastre.movio){
    historial.push(arrastre.antes);
    if (historial.length > 40) historial.shift();
    actualizarDeshacer();
    guardar();
  }
  arrastre = null;
}
lienzoEl().addEventListener('pointerup', finArrastre);
lienzoEl().addEventListener('pointercancel', finArrastre);

/* ---------- Escala del lienzo ---------- */
function ajustarEscala(){
  const caja = document.getElementById('escala');
  if (!caja || estado.parte !== 1) return;
  caja.style.width = '100%';
  const ancho = caja.clientWidth || ANCHO;
  let s = Math.min(1, ancho / ANCHO);
  const arriba = caja.getBoundingClientRect().top + (window.scrollY || 0);
  const alturaLibre = window.innerHeight - arriba - 92;
  if (window.innerWidth > 1000 && alturaLibre > 240)
    s = Math.max(s * 0.72, Math.min(s, alturaLibre / ALTO));
  escalaActual = Math.max(0.42, s);
  document.getElementById('lienzo').style.transform = 'scale(' + escalaActual + ')';
  caja.style.height = (ALTO * escalaActual) + 'px';
  caja.style.width = (ANCHO * escalaActual) + 'px';
}

function agregarMedicion(){
  const momento = (document.getElementById('inpMomento').value || '').trim();
  const dbTxt = document.getElementById('inpDb').value;
  if (!momento){ avisar('Escribí en qué momento midieron'); document.getElementById('inpMomento').focus(); return; }
  const db = Math.round(Number(dbTxt));
  if (!dbTxt || isNaN(db) || db < 0 || db > 140){
    avisar('Escribí un número de dB entre 0 y 140');
    document.getElementById('inpDb').focus(); return;
  }
  if (!colorSonido){ avisar('Elegí de qué color hay que pintarlo'); return; }
  guardarPaso();
  estado.datos.mediciones.push({ id:nuevoId(), momento:momento.slice(0,24), db:db, color:colorSonido });
  const usado = COLORES[colorSonido].nombre;
  colorSonido = null;

/* Recorte del croquis: se muestra sólo la parte dibujada, con un margen */
function cajaCroquis(){
  if (!estado.objetos.length) return {x:0, y:0, w:ANCHO, h:ALTO};
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  estado.objetos.forEach(o => {
    const cx = o.x + o.w/2, cy = o.y + o.h/2, r = (o.rot || 0) * Math.PI / 180;
    const c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    const mw = (o.w * c + o.h * s) / 2, mh = (o.w * s + o.h * c) / 2;
    x0 = Math.min(x0, cx - mw); x1 = Math.max(x1, cx + mw);
    y0 = Math.min(y0, cy - mh); y1 = Math.max(y1, cy + mh);
  });
  const m = 30;
  return { x:x0 - m, y:y0 - m, w:Math.max(80, x1 - x0 + m*2), h:Math.max(80, y1 - y0 + m*2) };
}

function pintarMiniCroquis(){
  const caja = document.getElementById('miniCroquis');
  if (!caja) return;
  caja.style.height = '';
  if (!estado.objetos.length){
    caja.style.height = '220px';
    caja.innerHTML = '<div class="sinCroquis">Todavía no hay croquis.<br>Volvé a la Parte 1 para dibujarlo.</div>';
    return;
  }
  const b = cajaCroquis();
  const ancho = caja.clientWidth || 400;
  const s = Math.min(ancho / b.w, 420 / b.h);
  caja.style.height = (b.h * s + 4) + 'px';
  const tx = (ancho - b.w * s) / 2 - b.x * s, ty = 2 - b.y * s;
  caja.innerHTML = '<div class="escena" style="width:' + ANCHO + 'px;height:' + ALTO +
    'px;transform:translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')">' + escenaHTML() + '</div>';
}

function rgbDe(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function claridad(hex){
  const [r,g,b] = rgbDe(hex);
  return 0.299*r + 0.587*g + 0.114*b;      /* 0 = negro, 255 = blanco */
}
/* Texto blanco sobre fondos oscuros y tinta sobre fondos claros: siempre alto contraste */
function textoSobre(hex){ return claridad(hex) < 150 ? '#FFFFFF' : '#1B1F2A'; }
function oscurecer(hex, f){
  const [r,g,b] = rgbDe(hex);
  const a = v => Math.round(v * f).toString(16).padStart(2,'0');
  return '#' + a(r) + a(g) + a(b);
}
function aclarar(hex, f){
  const [r,g,b] = rgbDe(hex);
  const a = v => Math.round(v + (255 - v) * f).toString(16).padStart(2,'0');
  return '#' + a(r) + a(g) + a(b);
}
/* Reparte los 5 colores de la paleta según su claridad */
function rolesPaleta(){
  const p = paletaActual();
  const orden = p.c.slice().sort((a,b) => claridad(a) - claridad(b));
  const c1 = orden[0], c2 = orden[1], c3 = orden[2], cL = orden[3];
  /* el borde de los bloques es el color más claro, suavizado, para que nunca compita con el texto */
  const cB = aclarar(orden[4], 0.55);
  let fuerte = c1;
  while (claridad(fuerte) > 130) fuerte = oscurecer(fuerte, 0.72);   /* para texto sobre blanco */
  /* si toda la paleta es muy clara, una línea más firme define los encabezados */
  const linea = claridad(c1) > 190 ? oscurecer(c1, 0.55) : 'transparent';
  return {c1:c1, c2:c2, c3:c3, cL:cL, cB:cB, fuerte:fuerte, linea:linea,
          tc1:textoSobre(c1), tc2:textoSobre(c2), tc3:textoSobre(c3)};
}
function estiloPaleta(){
  const r = rolesPaleta();
  return '--c1:' + r.c1 + ';--tc1:' + r.tc1 + ';--c2:' + r.c2 + ';--tc2:' + r.tc2 +
         ';--c3:' + r.c3 + ';--tc3:' + r.tc3 + ';--cL:' + r.cL + ';--cB:' + r.cB +
         ';--cFuerte:' + r.fuerte + ';--thL:' + r.linea + ';';
}

/* ---------- Arrastrar bloques para intercambiarlos ---------- */
function activarArrastrePoster(raiz){
  let act = null;
  raiz.querySelectorAll('.p-bloque').forEach(el => {
    el.addEventListener('pointerdown', e => {
      act = { el, id:el.dataset.b, destino:null };
      el.classList.add('arrastrando');
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!act) return;
      const bajo = document.elementFromPoint(e.clientX, e.clientY);
      const dest = bajo && bajo.closest ? bajo.closest('.p-bloque') : null;
      if (act.destino && act.destino !== dest) act.destino.classList.remove('destino');
      if (dest && dest !== act.el){ dest.classList.add('destino'); act.destino = dest; }
      else act.destino = null;
    });
    const soltar = () => {
      if (!act) return;
      act.el.classList.remove('arrastrando');
      if (act.destino){
        act.destino.classList.remove('destino');
        intercambiar(act.id, act.destino.dataset.b);
      }
      act = null;
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);
  });
}
function intercambiar(a, b){
  if (!a || !b || a === b) return;
  guardarPaso();
  const s = Object.assign({}, slotsActuales());
  const t = s[a]; s[a] = s[b]; s[b] = t;
  estado.poster.slots = s;
  pintarPoster(); pintarPanel3(); guardar();
  avisar('Bloques intercambiados');
}

function miniPlantilla(pl){
  /* dibujito de la estructura de cada plantilla */
  const mapa = {};
  pl.areas.forEach((fila, y) => {
    fila.replace(/['"]/g,'').trim().split(/\s+/).forEach((letra, x) => {
      if (!mapa[letra]) mapa[letra] = {x0:x, y0:y, x1:x, y1:y};
      else { mapa[letra].x1 = Math.max(mapa[letra].x1, x); mapa[letra].y1 = Math.max(mapa[letra].y1, y); }
    });
  });
  const slots = slotsActuales();
  const cual = {};
  Object.keys(slots).forEach(k => cual[slots[k]] = k);
  let r = '';
  Object.keys(mapa).forEach(letra => {
    const m = mapa[letra];
    const x = 2 + m.x0 * 16, y = 2 + m.y0 * 20;
    const w = (m.x1 - m.x0 + 1) * 16 - 3, h = (m.y1 - m.y0 + 1) * 20 - 3;
    const esImg = cual[letra] === 'croquis';
    r += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" fill="' +
         (esImg ? '#2A5FC4' : '#D8DEE7') + '"/>';
  });
  return '<svg viewBox="0 0 98 62" preserveAspectRatio="xMidYMid meet">' + r + '</svg>';
}
