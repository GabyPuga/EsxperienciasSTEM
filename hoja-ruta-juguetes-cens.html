  *, *::before, *::after{ box-sizing:border-box; }

  :root{
    --navy:#00456E;
    --navy-d:#003B5F;
    --c1:#C957DB;   /* punto de partida */
    --c2:#4272D7;   /* indagación (2 y 3) */
    --c3:#FFCC00;   /* producción */
    --c4:#42D789;   /* evaluación */
    --tinta:#062B44;
  }

  body{ margin:0; }

  .exp{
    position:relative;
    font-family:'Archivo', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:var(--navy);
    height:500px; max-height:500px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ---------- banner original, sin tocar ni recortar ---------- */
  .exp__banner{
    display:block; flex:1 1 auto; min-height:0;
    width:100%; height:100%;
    object-fit:contain; object-position:center top;
  }

  /* ---------- franja de momentos ---------- */
  .steps{
    position:relative;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:var(--navy-d);
    padding:16px 0 14px;
    flex:0 0 144px; height:144px;
    width:100%; margin:0 auto;
  }
  .steps::before{                      /* línea que une los círculos */
    content:''; position:absolute; top:30px; left:10%; right:10%;
    height:2px; background:rgba(255,255,255,.55);
  }

  .st{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:0 8px;
    background:none; border:0;
    border-left:1px solid rgba(255,255,255,.16);
    font-family:inherit; color:#fff; text-align:center;
    cursor:pointer;
    transition:background .16s ease;
  }
  .st:first-child{ border-left:0; }
  .st:hover{ background:rgba(255,255,255,.05); }
  .st:focus-visible{ outline:3px solid #fff; outline-offset:-3px; }

  .st__n{
    position:relative;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; color:var(--tinta);
    box-shadow:0 0 0 4px var(--navy-d);
    transition:transform .16s ease;
  }
  .st:hover .st__n{ transform:scale(1.12); }

  .st__t{
    font-size:11.5px; font-weight:700; line-height:1.2; color:#fff;
    height:3.6em; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }

  .st__cap{
    display:inline-block; border-radius:999px;
    padding:5px 11px; white-space:nowrap;
    font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .st:hover .st__cap{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.3); }

  .st--c1 .st__n, .st--c1 .st__cap{ background:var(--c1); color:#fff; }
  .st--c2 .st__n, .st--c2 .st__cap{ background:var(--c2); color:#fff; }
  .st--c3 .st__n, .st--c3 .st__cap{ background:var(--c3); color:var(--tinta); }
  .st--c4 .st__n, .st--c4 .st__cap{ background:var(--c4); color:var(--tinta); }

  /* ---------- ventana emergente ---------- */
  .ov{
    position:fixed; inset:0; z-index:60;
    background:rgba(2,25,42,.74);
    display:none; align-items:center; justify-content:center; padding:22px;
  }
  .ov.is-on{ display:flex; }

  .md{
    width:min(680px,100%); max-height:100%;
    background:#fff; border-radius:18px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 22px 60px rgba(0,0,0,.45);
    font-family:'Archivo', 'Segoe UI', system-ui, Arial, sans-serif;
  }
  .md__top{ height:9px; flex:0 0 auto; }
  .md__hd{ display:flex; align-items:flex-start; gap:13px; padding:18px 20px 12px; }
  .md__n{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; font-weight:800;
  }
  .md__ttl{ margin:0; font-size:21px; font-weight:800; color:var(--tinta); line-height:1.2; }
  .md__cap{
    display:inline-block; margin-top:8px; border-radius:999px; padding:5px 15px;
    font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  }
  .md__x{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%;
    border:0; background:#eef2f6; color:#3d556b;
    font-size:17px; font-weight:700; cursor:pointer; line-height:1;
    font-family:inherit;
  }
  .md__x:hover{ background:#dde5ec; }

  .md__bd{ padding:0 20px 16px; overflow:auto; font-size:15px; color:#33475c; line-height:1.5; }
  .md__bd p{ margin:0 0 13px; }
  .md__sub{
    font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:#6b8299; margin:0 0 7px;
  }
  .md__bd ul{ margin:0; padding-left:19px; }
  .md__bd li{ margin-bottom:5px; }

  .md__ft{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 20px; background:#f4f7fa;
  }
  .md__step{ font-size:12px; font-weight:700; color:#6b8299; }
  .md__nav{ display:flex; gap:8px; }
  .md__nav button{
    border:0; border-radius:9px; padding:8px 15px;
    background:var(--navy); color:#fff;
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .md__nav button:disabled{ opacity:.34; cursor:not-allowed; }

  @media (max-width:860px){
    .steps{ padding:20px 0 16px; }
    .steps::before{ top:33px; }
    .st{ padding:0 6px; gap:7px; }
    .st__n{ width:28px; height:28px; font-size:14px; }
    .st__t{ font-size:11px; }
    .st__cap{ font-size:8.5px; padding:5px 8px; letter-spacing:.03em; }
    .md__ttl{ font-size:17px; }
  }
</style>
</head>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mdTtl">
  <div class="md">
    <div class="md__top" id="mdTop"></div>
    <div class="md__hd">
      <span class="md__n" id="mdN"></span>
      <div style="flex:1 1 auto">
        <h3 class="md__ttl" id="mdTtl"></h3>
        <span class="md__cap" id="mdCap"></span>
      </div>
      <button class="md__x" id="mdX" aria-label="Cerrar">✕</button>
    </div>
    <div class="md__bd">
      <p id="mdD"></p>
      <p class="md__sub">Contenido del momento</p>
      <ul id="mdL"></ul>
    </div>
    <div class="md__ft">
      <span class="md__step" id="mdStep"></span>
      <div class="md__nav">
        <button id="mdPrev">‹ Anterior</button>
        <button id="mdNext">Siguiente ›</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const PASOS = [{"n": 1, "fase": "PUNTO DE PARTIDA", "c": "c1", "t": "¿Qué hacemos con todo lo que descartamos?", "d": "La experiencia se abre con una situación cotidiana: cuánto descartamos cada día y qué pasa con eso después. Se recuperan los saberes previos del grupo y se formula el desafío que va a guiar todo el recorrido.", "l": ["Lectura de datos sobre generación de residuos", "Conversación sobre hábitos de consumo y descarte", "Formulación del desafío de la experiencia"]}, {"n": 2, "fase": "INDAGACIÓN", "c": "c2", "t": "¿Basura o recurso?", "d": "Se observan y clasifican objetos descartados para distinguir lo que efectivamente es un residuo de lo que todavía puede recuperar una función. Aparecen las ideas de reutilizar, reparar y transformar.", "l": ["Análisis de materiales: plástico, cartón, vidrio, metal", "Criterios propios de clasificación", "Jerarquía en el tratamiento de residuos"]}, {"n": 3, "fase": "INDAGACIÓN", "c": "c2", "t": "¿Cómo hacemos para que un objeto se mueva solo?", "d": "Se investiga cómo se transmite y se transforma el movimiento. El grupo explora mecanismos simples para pasar de un objeto quieto a un objeto que se mueve por sí mismo.", "l": ["Ejes, ruedas, levas, palancas y engranajes", "Energía que se almacena y se libera", "Ensayos y pruebas con materiales recuperados"]}, {"n": 4, "fase": "PRODUCCIÓN", "c": "c3", "t": "Diseñamos y construimos un autómata reciclado.", "d": "Cada equipo diseña su autómata, elige los materiales recuperados que va a usar y lo construye. El proceso se documenta: bocetos, prototipos, pruebas y ajustes.", "l": ["Boceto y planificación del mecanismo", "Selección de materiales recuperados", "Construcción, prueba y ajuste", "Registro del proceso de trabajo"]}, {"n": 5, "fase": "EVALUACIÓN", "c": "c4", "t": "¿Cumple nuestro diseño con el desafío?", "d": "Se pone a prueba el autómata frente a los criterios acordados al comienzo y se comparte con el resto del grupo. Se revisa qué funcionó, qué se ajustaría y qué se aprendió en el camino.", "l": ["Criterios de evaluación acordados", "Prueba del mecanismo en funcionamiento", "Presentación y defensa ante el grupo", "Reflexión final sobre el recorrido"]}];
  const COLOR = { c1:'#C957DB', c2:'#4272D7', c3:'#FFCC00', c4:'#42D789' };
  const TINTA = { c1:'#fff',    c2:'#fff',    c3:'#062B44', c4:'#062B44' };

  const steps = document.getElementById('steps');
  const banner = document.querySelector('.exp__banner');
  const RATIO = 1672 / 809;                    // proporción del banner original

  const ALTO_TOTAL = 500, ALTO_FRANJA = 144;
  function alinear(){                          // la franja acompaña el ancho visible del banner
    const exp = document.querySelector('.exp');
    const ancho = Math.min(exp.clientWidth, (ALTO_TOTAL - ALTO_FRANJA) * RATIO);
    steps.style.width = Math.round(ancho) + 'px';
  }
  window.addEventListener('resize', alinear);
  if (window.ResizeObserver) new ResizeObserver(alinear).observe(document.querySelector('.exp'));
  if (banner.complete) alinear(); else banner.addEventListener('load', alinear);
  setTimeout(alinear, 60);
  const ov = document.getElementById('ov');
  let abierto = null;

  PASOS.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'st st--' + p.c;
    b.dataset.i = i;
    b.innerHTML =
      '<span class="st__n">' + p.n + '</span>' +
      '<span class="st__t">' + p.t + '</span>' +
      '<span class="st__cap">' + p.fase + '</span>';
    b.addEventListener('click', () => abrir(i));
    steps.appendChild(b);
  });

  function abrir(i){
    abierto = i;
    const p = PASOS[i];
    document.getElementById('mdTop').style.background = COLOR[p.c];
    const n = document.getElementById('mdN');
    n.textContent = p.n; n.style.background = COLOR[p.c]; n.style.color = TINTA[p.c];
    document.getElementById('mdTtl').textContent = p.t;
    const cap = document.getElementById('mdCap');
    cap.textContent = p.fase; cap.style.background = COLOR[p.c]; cap.style.color = TINTA[p.c];
    document.getElementById('mdD').textContent = p.d;
    document.getElementById('mdL').innerHTML = p.l.map(x => '<li>' + x + '</li>').join('');
    document.getElementById('mdStep').textContent = 'Momento ' + p.n + ' de ' + PASOS.length;
    document.getElementById('mdPrev').disabled = i === 0;
    document.getElementById('mdNext').disabled = i === PASOS.length - 1;
    ov.classList.add('is-on');
    document.getElementById('mdX').focus();
  }
  function cerrar(){
    ov.classList.remove('is-on');
    if (abierto != null){
      const b = steps.querySelector('button[data-i="' + abierto + '"]');
      if (b) b.focus();
    }
    abierto = null;
  }

  document.getElementById('mdX').addEventListener('click', cerrar);
  ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });
  document.getElementById('mdPrev').addEventListener('click', () => abrir(abierto - 1));
  document.getElementById('mdNext').addEventListener('click', () => abrir(abierto + 1));
  document.addEventListener('keydown', e => {
    if (!ov.classList.contains('is-on')) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowRight' && abierto < PASOS.length - 1) abrir(abierto + 1);
    if (e.key === 'ArrowLeft'  && abierto > 0) abrir(abierto - 1);
  });
})();
</script>
</body>
</html>
