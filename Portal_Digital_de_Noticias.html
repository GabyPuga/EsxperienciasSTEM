<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Digital de Noticias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{color-scheme:light;}
/* =========================================================
   PORTAL DIGITAL DE NOTICIAS
   Recurso educativo — Experiencias STEM+
   HTML + CSS + JS, sin dependencias (salvo Google Fonts)
   Carrusel de 2 pantallas × 5 noticias, sin scroll en netbook
   ========================================================= */

:root{
  --azul:#153244;
  --azul-90:#1d4159;
  --aqua:#8DE2D6;
  --aqua-oscuro:#3aa89a;
  --amarillo:#FFCC00;
  --blanco:#ffffff;
  --papel:#f4f6f7;
  --linea:#dde3e7;
  --gris:#5d6b74;

  --header-h:60px;
  --pager-h:48px;
  --radio:10px;
}

*,*::before,*::after{box-sizing:border-box;}

html,body{margin:0;padding:0;}

body{
  font-family:"Archivo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--papel);
  color:var(--azul);
  -webkit-font-smoothing:antialiased;
}

img{max-width:100%;display:block;}

:focus-visible{
  outline:3px solid var(--aqua-oscuro);
  outline-offset:2px;
  border-radius:4px;
}

/* ---------- Header ---------- */
.masthead{
  background:var(--blanco);
  border-bottom:1px solid var(--linea);
  box-shadow:0 1px 0 rgba(21,50,68,.04);
}
.masthead::before{
  content:"";
  display:block;
  height:5px;
  background:linear-gradient(90deg,var(--azul) 0 74%,var(--aqua) 74% 91%,var(--amarillo) 91% 100%);
}
.masthead__inner{
  height:var(--header-h);
  max-width:1440px;
  margin:0 auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.masthead__title{
  margin:0;
  font-size:26px;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1;
  color:var(--azul);
}
.masthead__sello{
  height:42px;
  width:auto;
}

/* ---------- Tablero / carrusel ---------- */
.tablero{
  position:relative;
  max-width:1440px;
  margin:0 auto;
  padding:16px 62px 0;
}

.mosaico{position:relative;}

.pantalla{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  gap:16px;
  animation:aparecer .3s ease both;
}
.pantalla[hidden]{display:none;}

@keyframes aparecer{
  from{opacity:0;transform:translateX(10px);}
  to{opacity:1;transform:none;}
}
@media (prefers-reduced-motion:reduce){
  .pantalla{animation:none;}
}

/* ---------- Tarjetas ---------- */
.tarjeta{
  background:var(--blanco);
  border:1px solid var(--linea);
  border-radius:var(--radio);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.tarjeta:hover{
  border-color:#c3ced6;
  box-shadow:0 4px 16px rgba(21,50,68,.09);
}

/* Composición gráfica del medio (sin capturas: identidad uniforme) */
.tarjeta__marca{
  position:relative;
  height:180px;
  flex:none;
  display:grid;
  place-items:center;
  padding:14px;
  overflow:hidden;
  background:#eef2f4;
  border-bottom:1px solid var(--linea);
}
/* renglones tenues: sugieren una página de diario, sin imitar ninguna */
.tarjeta__marca::before{
  content:"";
  position:absolute;
  inset:0 12% 0 12%;
  background-image:repeating-linear-gradient(
    to bottom,
    #e0e7eb 0 9px,
    transparent 9px 32px
  );
  opacity:.85;
}
/* filete superior azul */
.tarjeta__marca::after{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:5px;
  background:var(--azul);
}
.tarjeta__marca-nombre{
  position:relative;
  z-index:1;
  max-width:100%;
  background:var(--blanco);
  border-left:4px solid var(--aqua);
  padding:11px 15px 11px 13px;
  font-size:22px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.015em;
  color:var(--azul);
  text-align:left;
  box-shadow:0 1px 3px rgba(21,50,68,.06);
  overflow-wrap:anywhere;
}
.tarjeta__marca-nombre.es-largo{font-size:17px;}

.tarjeta__cuerpo{
  padding:13px 15px 14px;
  display:flex;
  flex-direction:column;
  min-width:0;
  flex:1;
}

.tarjeta__credito{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 8px;
  margin:0 0 7px;
  font-size:11px;
  line-height:1.1;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--azul);
}
.tarjeta__medio{
  border-left:3px solid var(--aqua);
  padding-left:7px;
}
.tarjeta__fecha{
  font-weight:500;
  letter-spacing:.02em;
  text-transform:none;
  color:var(--gris);
  font-size:11.5px;
}

.tarjeta__titulo{
  margin:0 0 7px;
  font-size:16px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.015em;
  color:var(--azul);
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}
.tarjeta__bajada{
  margin:0;
  font-size:12.5px;
  line-height:1.42;
  color:var(--gris);
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}

.tarjeta__pie{
  margin-top:auto;
  padding-top:12px;
}

/* ---------- Botones ---------- */
.boton{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:inherit;
  font-weight:600;
  font-size:12.5px;
  line-height:1;
  letter-spacing:.01em;
  padding:9px 14px;
  border-radius:6px;
  border:1.5px solid var(--azul);
  background:var(--blanco);
  color:var(--azul);
  cursor:pointer;
  text-decoration:none;
  transition:background-color .15s ease,color .15s ease;
}
.boton:hover{background:var(--azul);color:var(--blanco);}
.boton::after{
  content:"";
  width:6px;height:6px;
  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(-45deg);
  margin-left:1px;
}

.boton--lleno{
  background:var(--azul);
  color:var(--blanco);
  border-color:var(--azul);
  font-size:14px;
  padding:11px 18px;
}
.boton--lleno:hover{background:var(--azul-90);color:var(--blanco);}

/* ---------- Flechas ---------- */
.flecha{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:50%;
  border:1.5px solid var(--linea);
  background:var(--blanco);
  color:var(--azul);
  cursor:pointer;
  padding:0;
  box-shadow:0 2px 8px rgba(21,50,68,.08);
  transition:background-color .15s ease,color .15s ease,border-color .15s ease;
  z-index:5;
}
.flecha svg{width:22px;height:22px;}
.flecha:hover{background:var(--azul);color:var(--blanco);border-color:var(--azul);}
.flecha--prev{left:8px;}
.flecha--next{right:8px;}

/* ---------- Paginador (puntitos) ---------- */
.paginador{
  height:var(--pager-h);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.punto{
  position:relative;
  width:28px;height:28px;
  padding:0;
  border:0;
  background:none;
  cursor:pointer;
  display:grid;place-items:center;
  border-radius:50%;
}
.punto::before{
  content:"";
  display:block;
  width:10px;height:10px;
  border-radius:99px;
  background:transparent;
  border:1.5px solid #a9b6bf;
  transition:width .18s ease,background-color .18s ease,border-color .18s ease;
}
.punto:hover::before{border-color:var(--azul);background:#d8e0e5;}
.punto[aria-current="true"]::before{
  width:28px;
  background:var(--azul);
  border-color:var(--azul);
}
.punto span{
  position:absolute;
  width:1px;height:1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;}
.modal[hidden]{display:none;}
.modal__fondo{position:absolute;inset:0;background:rgba(12,28,39,.55);}
.modal__caja{
  position:relative;
  width:min(720px,100%);
  max-height:min(86vh,660px);
  background:var(--blanco);
  border-radius:12px;
  border-top:5px solid var(--azul);
  box-shadow:0 20px 50px rgba(9,24,33,.3);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.modal__x{
  position:absolute;top:12px;right:12px;
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:50%;
  border:1.5px solid var(--linea);
  background:var(--blanco);
  color:var(--azul);
  cursor:pointer;padding:0;z-index:2;
}
.modal__x svg{width:18px;height:18px;}
.modal__x:hover{background:var(--azul);color:var(--blanco);border-color:var(--azul);}

.modal__scroll{padding:26px 30px 22px;overflow-y:auto;}
.modal__credito{
  margin:0 0 10px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--azul);
  border-left:3px solid var(--aqua);
  padding-left:9px;
  max-width:calc(100% - 40px);
}
.modal__credito .sep{color:#b3bec6;margin:0 7px;}
.modal__credito .dato{color:var(--gris);font-weight:500;text-transform:none;letter-spacing:.01em;font-size:12.5px;}
.modal__titulo{
  margin:0 0 12px;
  font-size:25px;
  line-height:1.18;
  letter-spacing:-.02em;
  font-weight:700;
  color:var(--azul);
  max-width:calc(100% - 24px);
}
.modal__bajada{
  margin:0 0 16px;
  padding:12px 14px;
  background:#f2f7f8;
  border-left:3px solid var(--amarillo);
  border-radius:0 6px 6px 0;
  font-size:14.5px;
  line-height:1.5;
  color:var(--azul-90);
}
.modal__bajada[hidden]{display:none;}
.modal__resumen p{
  margin:0;
  font-size:15px;
  line-height:1.62;
  color:#2c3f4b;
}
.modal__resumen::before{
  content:"Resumen";
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gris);
  margin-bottom:7px;
}
.modal__pie{
  padding:14px 30px 18px;
  border-top:1px solid var(--linea);
  background:#fbfcfc;
  display:flex;
  justify-content:flex-end;
}

body.sin-scroll{overflow:hidden;}

/* =========================================================
   Netbook (desde 1000 px de ancho): sin scroll vertical
   ========================================================= */
@media (min-width:1000px) and (min-height:560px){
  html,body{height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;}
  .tablero{flex:1;min-height:0;display:flex;align-items:stretch;}
  .mosaico{flex:1;min-height:0;}
  .pantalla{height:100%;align-content:center;align-items:stretch;}

  /* Fila de tarjetas iguales, centrada verticalmente */
  .tarjeta{max-height:100%;}
  .tarjeta__marca{height:168px;flex:0 1 auto;min-height:96px;}
}

/* Pantallas altas: la imagen respira un poco más */
@media (min-width:1000px) and (min-height:740px){
  .tarjeta__marca{height:225px;}
  .tarjeta__titulo{font-size:16.5px;}
}

/* Netbooks de poca altura */
@media (min-width:1000px) and (max-height:790px){
  .masthead__title{font-size:24px;}
  .tarjeta__titulo{-webkit-line-clamp:4;}
  .tarjeta__bajada{-webkit-line-clamp:3;}
}

/* Netbooks chicas (1024 × 600 y similares): modo compacto */
@media (min-width:1000px) and (max-height:660px){
  :root{--header-h:50px;--pager-h:38px;}
  .tarjeta__marca{height:124px;min-height:74px;padding:10px;}
  .tarjeta__marca-nombre{font-size:18px;padding:8px 12px 8px 10px;}
  .tarjeta__marca-nombre.es-largo{font-size:14px;}
  .masthead::before{height:4px;}
  .masthead__title{font-size:20px;}
  .masthead__sello{height:34px;}
  .tablero{padding:12px 54px 0;}
  .pantalla{gap:12px;}
  .flecha{width:38px;height:38px;}
  .flecha svg{width:19px;height:19px;}
  .tarjeta__cuerpo{padding:10px 12px 11px;}
  .tarjeta__credito{font-size:10px;margin-bottom:5px;}
  .tarjeta__fecha{font-size:10.5px;}
  .tarjeta__titulo{font-size:14.5px;line-height:1.2;-webkit-line-clamp:4;margin-bottom:5px;}
  .tarjeta__bajada{font-size:11.5px;line-height:1.34;-webkit-line-clamp:2;}
  .tarjeta__pie{padding-top:9px;}
  .boton{font-size:11.5px;padding:7px 11px;}
  .modal__caja{max-height:94vh;}
  .modal__scroll{padding:20px 24px 16px;}
  .modal__titulo{font-size:21px;}
  .modal__bajada{font-size:13.5px;padding:10px 12px;margin-bottom:12px;}
  .modal__resumen p{font-size:14px;line-height:1.55;}
  .modal__pie{padding:11px 24px 14px;}
}

/* =========================================================
   Tablet: el carrusel pasa a 2 columnas y admite scroll
   ========================================================= */
@media (max-width:999px){
  .tablero{padding:16px 52px 0;}
  .pantalla{
    grid-template-columns:1fr 1fr;
    align-items:stretch;
    gap:14px;
  }
  .tarjeta__marca{height:150px;}
  .tarjeta__titulo{font-size:17px;-webkit-line-clamp:4;}
  .tarjeta__bajada{font-size:13px;-webkit-line-clamp:3;}
}

/* =========================================================
   Celular: una columna, las 10 noticias seguidas
   ========================================================= */
@media (max-width:719px){
  .masthead__inner{padding:0 16px;height:auto;min-height:56px;flex-wrap:wrap;gap:8px;}
  .masthead__title{font-size:20px;padding:10px 0;}
  .masthead__sello{height:34px;}
  .tablero{padding:14px 16px 0;}
  .pantalla{grid-template-columns:1fr;gap:12px;}
  .pantalla[hidden]{display:grid;}
  .pantalla + .pantalla{margin-top:12px;}
  .tarjeta__marca{height:150px;}
  .tarjeta__titulo{font-size:18px;-webkit-line-clamp:5;}
  .tarjeta__bajada{-webkit-line-clamp:4;}
  .flecha,.paginador{display:none;}
  .modal{padding:0;}
  .modal__caja{max-height:100vh;height:100%;border-radius:0;width:100%;}
  .modal__scroll{padding:22px 18px 18px;}
  .modal__titulo{font-size:21px;}
  .modal__pie{padding:12px 18px 16px;}
}

</style>
</head>

/* =========================================================
   Render del mosaico: 2 pantallas de 5 noticias
   ========================================================= */

const POR_PANTALLA = 5;
const mosaico = document.getElementById("mosaico");
const puntos = Array.from(document.querySelectorAll(".punto"));
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");

let paginaActual = 0;
const totalPaginas = Math.ceil(NOTICIAS.length / POR_PANTALLA);

function crearTarjeta(noticia) {
  const art = document.createElement("article");
  art.className = "tarjeta";

  // Composición gráfica uniforme: solo el nombre del medio
  const marca = document.createElement("div");
  marca.className = "tarjeta__marca";
  marca.setAttribute("aria-hidden", "true");
  const placa = document.createElement("span");
  placa.className = "tarjeta__marca-nombre";
  placa.textContent = noticia.medio;
  if (noticia.medio.length > 12) placa.classList.add("es-largo");
  marca.appendChild(placa);

  const cuerpo = document.createElement("div");
  cuerpo.className = "tarjeta__cuerpo";

  const credito = document.createElement("p");
  credito.className = "tarjeta__credito";
  const medio = document.createElement("span");
  medio.className = "tarjeta__medio";
  medio.textContent = noticia.medio;
  const fecha = document.createElement("span");
  fecha.className = "tarjeta__fecha";
  fecha.textContent = noticia.fecha;
  credito.append(medio, fecha);

  const titulo = document.createElement("h2");
  titulo.className = "tarjeta__titulo";
  titulo.textContent = noticia.titulo;

  cuerpo.append(credito, titulo);

  if (noticia.bajada) {
    const bajada = document.createElement("p");
    bajada.className = "tarjeta__bajada";
    bajada.textContent = noticia.bajada;
    cuerpo.appendChild(bajada);
  }

  const pie = document.createElement("div");
  pie.className = "tarjeta__pie";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "boton";
  btn.textContent = "Ver resumen";
  btn.setAttribute("aria-label", "Ver resumen de la noticia: " + noticia.titulo);
  btn.addEventListener("click", () => abrirModal(noticia, btn));
  pie.appendChild(btn);
  cuerpo.appendChild(pie);

  art.append(marca, cuerpo);
  return art;
}

function renderMosaico() {
  mosaico.innerHTML = "";
  for (let p = 0; p < totalPaginas; p++) {
    const seccion = document.createElement("section");
    seccion.className = "pantalla";
    seccion.dataset.pagina = String(p);
    seccion.setAttribute("aria-label", "Noticias " + (p * POR_PANTALLA + 1) + " a " + Math.min((p + 1) * POR_PANTALLA, NOTICIAS.length));
    if (p !== paginaActual) seccion.hidden = true;

    NOTICIAS.slice(p * POR_PANTALLA, (p + 1) * POR_PANTALLA)
      .forEach((noticia) => seccion.appendChild(crearTarjeta(noticia)));

    mosaico.appendChild(seccion);
  }
  actualizarPaginador();
}

function irA(pagina) {
  paginaActual = (pagina + totalPaginas) % totalPaginas;
  mosaico.querySelectorAll(".pantalla").forEach((sec) => {
    sec.hidden = Number(sec.dataset.pagina) !== paginaActual;
  });
  actualizarPaginador();
}

function actualizarPaginador() {
  puntos.forEach((punto, i) => {
    const activo = i === paginaActual;
    punto.setAttribute("aria-current", activo ? "true" : "false");
  });
}

btnPrev.addEventListener("click", () => irA(paginaActual - 1));
btnNext.addEventListener("click", () => irA(paginaActual + 1));
puntos.forEach((punto) => punto.addEventListener("click", () => irA(Number(punto.dataset.pagina))));

document.addEventListener("keydown", (e) => {
  if (modal.hidden === false) return;
  if (e.key === "ArrowLeft") irA(paginaActual - 1);
  if (e.key === "ArrowRight") irA(paginaActual + 1);
});

/* =========================================================
   Modal
   ========================================================= */

const modal = document.getElementById("modal");
const modalCaja = modal.querySelector(".modal__caja");
const modalCredito = document.getElementById("modalCredito");
const modalTitulo = document.getElementById("modalTitulo");
const modalBajada = document.getElementById("modalBajada");
const modalResumen = document.getElementById("modalResumen");
const modalEnlace = document.getElementById("modalEnlace");
const modalCerrar = document.getElementById("modalCerrar");
let disparador = null;

function abrirModal(noticia, origen) {
  disparador = origen || null;

  modalCredito.innerHTML = "";
  const medio = document.createElement("span");
  medio.textContent = noticia.medio;
  modalCredito.appendChild(medio);
  agregarDato(modalCredito, noticia.fecha);
  if (noticia.autor) agregarDato(modalCredito, noticia.autor);

  modalTitulo.textContent = noticia.titulo;

  if (noticia.bajada) {
    modalBajada.textContent = noticia.bajada;
    modalBajada.hidden = false;
  } else {
    modalBajada.textContent = "";
    modalBajada.hidden = true;
  }

  modalResumen.innerHTML = "";
  const p = document.createElement("p");
  p.textContent = noticia.resumen.join(" ");
  modalResumen.appendChild(p);

  modalEnlace.href = noticia.url;
  modalEnlace.setAttribute("aria-label", "Leer la noticia completa en " + noticia.medio + " (se abre en una pestaña nueva)");

  modal.hidden = false;
  document.body.classList.add("sin-scroll");
  modalCerrar.focus();
}

function agregarDato(contenedor, texto) {
  const sep = document.createElement("span");
  sep.className = "sep";
  sep.setAttribute("aria-hidden", "true");
  sep.textContent = "·";
  const dato = document.createElement("span");
  dato.className = "dato";
  dato.textContent = texto;
  contenedor.append(sep, dato);
}

function cerrarModal() {
  modal.hidden = true;
  document.body.classList.remove("sin-scroll");
  if (disparador) disparador.focus();
}

modalCerrar.addEventListener("click", cerrarModal);
modal.querySelector("[data-cerrar]").addEventListener("click", cerrarModal);

document.addEventListener("keydown", (e) => {
  if (modal.hidden) return;
  if (e.key === "Escape") {
    cerrarModal();
    return;
  }
  if (e.key === "Tab") {
    const focusables = modalCaja.querySelectorAll("button, a[href]");
    if (!focusables.length) return;
    const primero = focusables[0];
    const ultimo = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === primero) {
      e.preventDefault();
      ultimo.focus();
    } else if (!e.shiftKey && document.activeElement === ultimo) {
      e.preventDefault();
      primero.focus();
    }
  }
});

renderMosaico();

</script>
