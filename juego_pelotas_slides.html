<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego Pelotas y Figuras Geométricas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFCC00;
    --dark: #153244;
    --teal-light: #8DE2D6;
    --teal-mid: #79C7C3;
    --white: #FFFFFF;
    --dark-gray: #3C3C3B;
    --bg: #f0f2f4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Archivo', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 10px 16px;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 10px 22px;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 10px;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }

  .instructions {
    text-align: center;
    font-size: 0.9rem;
    color: var(--dark-gray);
    font-weight: 600;
    margin-bottom: 12px;
  }

  /* Barra superior con info del slide y puntaje */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px 10px;
    font-weight: 700;
    color: var(--dark);
    font-size: 0.9rem;
  }

  .slide-counter {
    font-weight: 700;
    color: var(--dark);
  }

  .score-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .score-display .star-icon { font-size: 1rem; line-height: 1; }

  /* SLIDE: imagen grande + lista de figuras */
  .slide-container {
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(21,50,68,0.08);
    padding: 16px 20px;
  }

  .slide {
    display: grid;
    grid-template-columns: 256px 1fr;
    gap: 28px;
    align-items: stretch;
    min-height: 256px;
  }

  /* Pelota grande sin contenedor, con sombra de piso elíptica que la ancla */
  .ball-display {
    width: 256px;
    height: 256px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Sombra elíptica debajo: ancla la pelota al "piso" */
  .ball-display::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 75%;
    height: 22px;
    background: radial-gradient(ellipse at center, rgba(21,50,68,0.55) 0%, rgba(21,50,68,0.25) 45%, rgba(21,50,68,0) 75%);
    z-index: 0;
    pointer-events: none;
  }

  .ball-display img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 3px rgba(21,50,68,0.4));
  }

  /* Figuras a la derecha - distribuye verticalmente para igualar la altura de la pelota */
  .figures-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }

  .figures-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .figure-chip {
    background: rgba(141, 226, 214, 0.35);
    border: 2.5px solid var(--teal-mid);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: center;
    font-weight: 700;
    color: var(--dark);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .figure-chip:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(21,50,68,0.18);
    background: rgba(141, 226, 214, 0.6);
  }

  /* Seleccionado: amarillo */
  .figure-chip.selected {
    background: var(--yellow);
    border-color: var(--dark);
    color: var(--dark);
  }

  /* Marcado correcto al comprobar */
  .figure-chip.correct {
    background: #c8e6c9;
    border-color: #4CAF50;
    color: #1b5e20;
  }

  /* Marcado incorrecto al comprobar */
  .figure-chip.wrong {
    background: #ffcdd2;
    border-color: #e53935;
    color: #b71c1c;
  }

  /* No tildada al comprobar: gris */
  .figure-chip.inactive {
    background: #ececec;
    border-color: #bdbdbd;
    color: #888;
  }

  /* Slide congelada (después de avanzar) */
  .slide.frozen .figure-chip {
    cursor: default;
    pointer-events: none;
    opacity: 0.85;
  }

  /* Mensaje de feedback de slide */
  .slide-feedback {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }

  .slide-feedback.show { display: block; }
  .slide-feedback.ok { background: var(--teal-light); color: var(--dark); }
  .slide-feedback.err { background: #ffebee; color: #b71c1c; }
  .slide-feedback.hint { background: #fff4cc; color: var(--dark); }

  /* Controles inferiores */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .controls-left, .controls-center, .controls-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    border: none;
    border-radius: 50px;
    padding: 10px 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s, background 0.2s;
  }

  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--dark); color: white; }
  .btn-secondary {
    background: white;
    color: var(--dark);
    border: 2.5px solid var(--dark);
    padding: 8px 20px;
  }
  .btn-hint {
    background: var(--yellow);
    color: var(--dark);
  }

  .hint-icon {
    width: 18px;
    height: 18px;
    display: inline-block;
    vertical-align: middle;
  }

  /* Pantalla final */
  .final-screen {
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(21,50,68,0.08);
    padding: 28px 24px;
    text-align: center;
    display: none;
  }

  .final-screen.show { display: block; }

  .final-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .final-score {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--dark);
    margin: 8px 0;
  }

  .final-score .max { color: #999; font-size: 1.6rem; font-weight: 700; }

  .final-msg {
    font-size: 0.95rem;
    color: var(--dark-gray);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .final-bonus {
    background: var(--yellow);
    color: var(--dark);
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    display: inline-block;
    margin-bottom: 14px;
  }

  /* Responsive */
  @media (max-width: 720px) {
    .slide { grid-template-columns: 1fr; gap: 16px; }
    .ball-display { width: 160px; height: 160px; margin: 0 auto; }
    .figures-list { grid-template-columns: 1fr 1fr; }
    header { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="app">
  <header>¿Qué figuras geométricas aparecen en cada modelo?</header>
  <div class="instructions">Seleccioná todas las opciones que encuentres en cada pelota.</div>

  <div class="top-bar">
    <div class="slide-counter" id="slide-counter">Pelota 1 de 7</div>

  // Las 6 figuras posibles
  const FIGURES = ['Rombo', 'Cuadrado', 'Triángulo', 'Rectángulo', 'Hexágono', 'Pentágono'];

  // Las 7 pelotas con sus respuestas (figuras correctas)
  const BALLS = [
    { id: 'p1', img: IMAGES.p1, correct: ['Rombo', 'Cuadrado'] },
    { id: 'p2', img: IMAGES.p2, correct: ['Triángulo', 'Rectángulo', 'Pentágono'] },
    { id: 'p3', img: IMAGES.p3, correct: ['Cuadrado', 'Triángulo'] },
    { id: 'p4', img: IMAGES.p4, correct: ['Hexágono', 'Pentágono'] },
    { id: 'p5', img: IMAGES.p5, correct: ['Triángulo', 'Cuadrado', 'Pentágono'] },
    { id: 'p6', img: IMAGES.p6, correct: ['Triángulo'] },
    { id: 'p7', img: IMAGES.p7, correct: ['Pentágono', 'Triángulo'] },
  ];

  // Estado del juego
  let order = [];           // orden barajado de pelotas
  let currentIdx = 0;       // índice en order
  let selections = {};      // pelotaId -> [figuras seleccionadas]
  let attempts = {};        // pelotaId -> cantidad de intentos hechos
  let solved = {};          // pelotaId -> boolean (si la resolvió perfecto)
  let frozen = {};          // pelotaId -> boolean (si ya avanzó, queda congelada)
  let hintsUsed = {};       // pelotaId -> boolean

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initGame() {
    order = shuffle(BALLS);
    currentIdx = 0;
    selections = {};
    attempts = {};
    solved = {};
    frozen = {};
    hintsUsed = {};
    order.forEach(b => {
      selections[b.id] = [];
      attempts[b.id] = 0;
      solved[b.id] = false;
      frozen[b.id] = false;
      hintsUsed[b.id] = false;
    });
    document.getElementById('final-screen').classList.remove('show');
    document.getElementById('slide-container').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';
    renderSlide();
    updateScore();
  }

  function renderSlide() {
    const ball = order[currentIdx];
    document.getElementById('slide-counter').textContent = `Pelota ${currentIdx + 1} de ${order.length}`;
    document.getElementById('slide-img').src = ball.img;

    const slide = document.getElementById('slide');
    if (frozen[ball.id]) slide.classList.add('frozen');
    else slide.classList.remove('frozen');

    // Renderizar los chips de figuras
    const list = document.getElementById('figures-list');
    list.innerHTML = '';
    FIGURES.forEach(fig => {
      const chip = document.createElement('div');
      chip.className = 'figure-chip';
      chip.dataset.figure = fig;
      chip.textContent = fig;

      if (frozen[ball.id]) {
        // Slide congelada: mostrar los 3 estados al verificar
        const tildada = selections[ball.id].includes(fig);
        const esCorrecta = ball.correct.includes(fig);
        if (tildada && esCorrecta) chip.classList.add('correct');
        else if (tildada && !esCorrecta) chip.classList.add('wrong');
        else chip.classList.add('inactive');
      } else {
        // Slide activa: estado normal (selected si está tildada)
        if (selections[ball.id].includes(fig)) chip.classList.add('selected');
      }

      chip.addEventListener('click', () => toggleFigure(fig));
      list.appendChild(chip);
    });

    // Botones
    document.getElementById('btn-prev').disabled = (currentIdx === 0);
    const isLast = (currentIdx === order.length - 1);
    document.getElementById('btn-next').textContent = isLast ? 'Terminar →' : 'Siguiente →';

    // Si está congelada, ocultar Comprobar y Pistas (ya pasaron)
    document.getElementById('btn-check').style.display = frozen[ball.id] ? 'none' : 'flex';
    document.getElementById('btn-hint').style.display = frozen[ball.id] ? 'none' : 'flex';

    // Limpiar feedback
    const fb = document.getElementById('slide-feedback');
    fb.className = 'slide-feedback';
    fb.textContent = '';
  }

  function toggleFigure(fig) {
    const ball = order[currentIdx];
    if (frozen[ball.id]) return;
    const sels = selections[ball.id];
    const i = sels.indexOf(fig);
    if (i >= 0) sels.splice(i, 1);
    else sels.push(fig);

    // Re-render solo de los chips (sin perder el resto)
    const chips = document.querySelectorAll('.figure-chip');
    chips.forEach(chip => {
      chip.classList.remove('selected', 'wrong');
      if (selections[ball.id].includes(chip.dataset.figure)) {
        chip.classList.add('selected');
      }
    });

    // Limpiar feedback si lo había
    const fb = document.getElementById('slide-feedback');
    fb.className = 'slide-feedback';
    fb.textContent = '';
  }

  function showHint() {
    const ball = order[currentIdx];
    hintsUsed[ball.id] = true;
    const n = ball.correct.length;
    const fb = document.getElementById('slide-feedback');
    let msg = '';
    if (n === 1) msg = 'Esta pelota tiene 1 sola figura. ¡Buscala con atención!';
    else msg = `Esta pelota tiene ${n} figuras distintas. ¡Buscalas con atención!`;
    fb.textContent = msg;
    fb.className = 'slide-feedback show hint';
  }

  function checkSlide() {
    const ball = order[currentIdx];
    if (frozen[ball.id]) return;
    attempts[ball.id]++;
    const sels = selections[ball.id];
    const correct = ball.correct;

    // Calcular: ¿es exactamente igual?
    const allCorrect = sels.length === correct.length && sels.every(f => correct.includes(f));

    const chips = document.querySelectorAll('.figure-chip');
    const fb = document.getElementById('slide-feedback');

    if (allCorrect) {
      solved[ball.id] = true;
      fb.textContent = '¡Genial! Tocá "Siguiente" para continuar.';
      fb.className = 'slide-feedback show ok';
      // Todos los correctos en verde, los no seleccionados en gris
      chips.forEach(chip => {
        chip.classList.remove('selected', 'wrong', 'correct', 'inactive');
        if (correct.includes(chip.dataset.figure)) {
          chip.classList.add('correct');
        } else {
          chip.classList.add('inactive');
        }
      });
    } else {
      // Tres estados al validar:
      // - tildada y correcta → verde
      // - tildada y NO correcta → rojo
      // - no tildada → gris (inactive)
      chips.forEach(chip => {
        chip.classList.remove('selected', 'wrong', 'correct', 'inactive');
        const fig = chip.dataset.figure;
        const tildada = sels.includes(fig);
        const esCorrecta = correct.includes(fig);
        if (tildada && esCorrecta) chip.classList.add('correct');
        else if (tildada && !esCorrecta) chip.classList.add('wrong');
        else chip.classList.add('inactive');
      });
      fb.textContent = 'Revisá tus respuestas. Si necesitás, tocá Pistas para saber cuántas figuras buscar.';
      fb.className = 'slide-feedback show err';
    }
  }

  function goNext() {
    const ball = order[currentIdx];
    // Bloquear avance si todavía no comprobó esta slide
    if (attempts[ball.id] === 0) {
      const fb = document.getElementById('slide-feedback');
      fb.textContent = 'Antes de pasar, tocá "Comprobar" para verificar tu respuesta.';
      fb.className = 'slide-feedback show err';
      return;
    }
    frozen[ball.id] = true;
    updateScore();
    if (currentIdx === order.length - 1) {
      showFinalScreen();
    } else {
      currentIdx++;
      renderSlide();
    }
  }

  function goPrev() {
    if (currentIdx > 0) {
      currentIdx--;
      renderSlide();
    }
  }

  function updateScore() {
    let points = 0;
    Object.keys(solved).forEach(id => { if (solved[id]) points++; });
    // Bonus si todas resueltas Y todas al primer intento
    const allSolvedFirstTry = order.every(b => solved[b.id] && attempts[b.id] === 1);
    const bonus = allSolvedFirstTry ? 1 : 0;
    document.getElementById('score-text').textContent = `Puntos: ${points + bonus} / 8`;
    document.getElementById('star-icon').textContent = (points + bonus >= 8) ? '★' : '☆';
  }

  function showFinalScreen() {
    document.getElementById('slide-container').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    const screen = document.getElementById('final-screen');

    let points = 0;
    order.forEach(b => { if (solved[b.id]) points++; });
    const allFirstTry = order.every(b => solved[b.id] && attempts[b.id] === 1);
    const bonus = allFirstTry ? 1 : 0;
    const total = points + bonus;

    document.getElementById('final-points').textContent = total;
    document.getElementById('final-bonus').style.display = bonus > 0 ? 'inline-block' : 'none';

    let msg = '';
    if (total === 8) msg = '¡Perfecto! Identificaste todas las figuras al primer intento.';
    else if (points === 7) msg = '¡Muy bien! Resolviste las 7 pelotas. Probá de nuevo si querés conseguir el bonus.';
    else if (points >= 5) msg = `¡Buen trabajo! Resolviste ${points} pelotas. Volvé a intentar las que te quedaron.`;
    else if (points >= 3) msg = `Resolviste ${points} pelotas. Probá de nuevo y mirá las pelotas con atención.`;
    else msg = `Resolviste ${points} pelotas. ¡No te preocupes! Volvé a intentarlo y usá las Pistas si las necesitás.`;
    document.getElementById('final-msg').textContent = msg;

    screen.classList.add('show');
  }

  function restartGame() {
    initGame();
  }

  // Iniciar
  initGame();
</script>
</body>
</html>
