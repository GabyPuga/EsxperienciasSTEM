<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario maker · Maker vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f8fafa;
    --card: #ffffff;
    --tinta: #16242e;
    --tinta-suave: #5a6a75;
    --linea: #e2e6e9;
    --bien: #0f7a45;
    --bien-suave: #e7f4ec;
    --mal: #b3401f;
    --mal-suave: #fbeceb;
    --fuente: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* cada grupo tiene su color, igual que en el glosario */
  .app[data-grupo="acciones"] {
    --acento: #166665;
    --acento-fuerte: #00494B;
    --acento-banda: #D3EEEB;
    --acento-suave: #F1F9F8;
    --acento-borde: #BFE2DE;
  }
  .app[data-grupo="materiales"] {
    --acento: #544194;
    --acento-fuerte: #453581;
    --acento-banda: #E8E2F5;
    --acento-suave: #F5F3FA;
    --acento-borde: #D6CCEE;
  }
  .app[data-grupo="final"] {
    --acento: #2F4256;
    --acento-fuerte: #1C2B3A;
    --acento-banda: #E7ECF0;
    --acento-suave: #F4F7F9;
    --acento-borde: #D3DBE2;
  }

  *, *::before, *::after { box-sizing: border-box; }

  /* necesario: .actividad y .resultados usan display:flex, que anula a [hidden] */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--tinta);
    font-family: var(--fuente);
    font-size: 16px;
    line-height: 1.45;
  }

  .app {
    height: 550px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }

  /* ---------- cabecera ---------- */

  .cabecera {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 18px;
    flex-wrap: wrap;
    padding: 6px 16px 6px 7px;
    border-radius: 14px;
    background: var(--acento-banda);
    transition: background-color .3s ease;
  }

  .titulo-grupo { display: flex; align-items: center; gap: 12px; }

  .icono {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--acento);
    transition: background-color .3s ease;
  }

  .icono svg { width: 22px; height: 22px; display: block; }

  h1 {
    margin: 0;
    font-size: clamp(1.2rem, 1rem + .8vw, 1.5rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--acento-fuerte);
  }

  h1 .en { font-weight: 400; opacity: .62; }

  .sub { margin: 0; font-size: .88rem; color: var(--acento-fuerte); opacity: .78; }

  .consigna {
    margin: 0;
    text-align: right;
    font-size: .92rem;
    font-weight: 600;
    color: var(--acento-fuerte);
    line-height: 1.25;
  }

  .consigna .en { display: block; font-weight: 400; opacity: .7; }

  /* el puntaje va arriba, al lado del título */
  .marcador { display: flex; align-items: baseline; gap: 8px; color: var(--acento-fuerte); }
  .marcador .n { font-size: 2.2rem; font-weight: 800; line-height: 1; }
  .marcador .de { font-size: 1rem; font-weight: 600; opacity: .72; }

  /* ---------- tablero ---------- */

  .actividad {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tablero {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 18px;
  }

  .pieza {
    flex: 0 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .foto {
    flex: 1;
    min-height: 0;
    aspect-ratio: 1 / 1;
    width: 100%;
    position: relative;
    padding: 0;
    border: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #e9ebee;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(15, 23, 42, .09), 0 1px 3px rgba(15, 23, 42, .05);
    transition: transform .15s ease;
  }

  .foto img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    object-fit: cover;
    display: block;
  }

  .foto::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 3px solid transparent;
    transition: border-color .15s ease, background-color .15s ease;
  }

  .pieza.elegible .foto { transform: translateY(-2px); }
  .pieza.elegible .foto::after { border-color: var(--acento); background: rgba(255, 255, 255, .26); }
  .foto:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }

  .pieza.bien .foto::after { border-color: var(--bien); }
  .pieza.mal .foto::after { border-color: var(--mal); }
  .pieza.verificada .foto { cursor: default; }

  /* ---------- casillero: se toca igual que la foto ---------- */

  .casillero {
    flex: none;
    height: 62px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 2px dashed #bcc6cd;
    background: var(--card);
    color: var(--tinta-suave);
    font: inherit;
    text-align: center;
    padding: 4px 8px;
    line-height: 1.15;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease, color .15s ease;
  }

  .casillero .vacio { font-size: .9rem; font-weight: 600; }
  .casillero .vacio-en { font-size: .78rem; opacity: .72; }
  .casillero:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }

  .pieza.elegible .casillero {
    border-style: solid;
    border-color: var(--acento);
    background: var(--acento-banda);
    color: var(--acento-fuerte);
  }

  /* con una palabra puesta, todavía sin verificar */
  .pieza.puesta .casillero {
    border-style: solid;
    border-color: var(--acento-borde);
    background: var(--acento-suave);
    color: var(--tinta);
  }

  .casillero .palabra-puesta { font-size: 1.06rem; font-weight: 700; }
  .casillero .quitar { font-size: .74rem; opacity: .6; }

  /* ya verificado */
  .pieza.bien .casillero { border-color: var(--bien); background: var(--bien-suave); cursor: default; }
  .pieza.mal .casillero { border-color: var(--mal); background: var(--mal-suave); cursor: default; }
  .pieza.bien .casillero .en { font-size: 1.06rem; font-weight: 700; color: var(--bien); }
  .pieza.mal .casillero .en { font-size: 1.06rem; font-weight: 700; color: var(--mal); }
  .casillero .es { font-size: .84rem; color: var(--tinta-suave); }
  .casillero .pusiste { font-size: .74rem; color: var(--mal); }

  /* ---------- banco de palabras ---------- */

  .banco {
    flex: none;
    min-height: 66px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px;
    border-radius: 14px;
    background: var(--acento-suave);
    border: 1.5px solid var(--acento-borde);
  }

  .palabra {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 11px 26px;
    border: 1.5px solid var(--linea);
    border-radius: 999px;
    background: var(--card);
    color: var(--tinta);
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  .palabra:hover { border-color: #b9c3cb; box-shadow: 0 2px 10px rgba(15, 23, 42, .08); }
  .palabra[aria-pressed="true"] {
    border-color: var(--acento);
    background: var(--acento);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, .18);
  }
  .palabra.usada { visibility: hidden; }
  .palabra:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }

  .banco .listo { margin: 0; font-size: 1.02rem; font-weight: 700; color: var(--acento-fuerte); }
  .banco .listo span { font-weight: 400; opacity: .7; }

  /* con las tres puestas, el banco deja de mostrar fichas y avisa qué sigue */
  .banco.completo .palabra { display: none; }
  .banco .aviso { margin: 0; text-align: center; font-size: 1rem; font-weight: 700; color: var(--acento-fuerte); }
  .banco .aviso span { display: block; font-weight: 400; font-size: .86rem; opacity: .7; }

  /* ---------- pie ---------- */

  .pie {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .dots { display: flex; gap: 12px; }

  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #cfd1d4;
    transition: background-color .25s ease;
  }

  .dot.is-active { background: var(--acento); }
  .dot.lista { background: var(--acento-borde); }

  .boton-principal {
    font: inherit;
    font-weight: 600;
    padding: 10px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--acento);
    color: #fff;
    cursor: pointer;
    transition: background-color .15s ease, filter .15s ease;
  }

  .boton-principal .en { font-weight: 400; opacity: .78; }
  .boton-principal:hover:not(:disabled) { filter: brightness(1.15); }
  .boton-principal:disabled { background: #c3ccd3; cursor: not-allowed; }
  .boton-principal:focus-visible { outline: 2px solid var(--acento-fuerte); outline-offset: 3px; }

  /* ---------- resultados ---------- */

  .resultados {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .revision {
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    align-content: center;
  }

  .col {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px 10px 10px;
    background: var(--card);
    border: 1.5px solid var(--linea);
    border-left: 4px solid var(--c);
    border-radius: 12px;
  }

  .col.acciones { --c: #166665; --cf: #00494B; --cb: #D3EEEB; }
  .col.materiales { --c: #544194; --cf: #453581; --cb: #E8E2F5; }
  .col.incorrecta { border-left-color: var(--mal); }

  .col img {
    flex: none;
    width: 76px;
    height: 76px;
    border-radius: 10px;
    object-fit: cover;
    display: block;
  }

  .col-texto { min-width: 0; }
  .col h3 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.2; color: var(--cf); }
  .col.incorrecta h3 { color: var(--tinta); }
  .col .es { margin: 1px 0 0; font-size: .88rem; color: var(--tinta-suave); }

  .veredicto {
    flex: none;
    margin-left: auto;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: .78rem;
    font-weight: 700;
    background: var(--bien-suave);
    color: var(--bien);
  }

  .col.incorrecta .veredicto { background: var(--mal-suave); color: var(--mal); }

  /* ---------- pantallas angostas ---------- */

  @media (max-width: 820px) {
    .app { height: auto; min-height: 100svh; }
    .cabecera { align-items: flex-start; }
    .consigna { text-align: left; }
    .tablero { flex-direction: column; }
    .pieza { flex: none; width: 100%; }
    .foto { width: 100%; flex: none; }
    .banco {
      order: -1;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 6px 14px rgba(15, 23, 42, .08);
    }
    .revision { grid-template-columns: 1fr; }
    .resultados { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-grupo="acciones">
  <header class="cabecera">
    <div class="titulo-grupo">
      <span class="icono" id="icono"></span>
      <div>
        <h1 id="titulo"></h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <p class="consigna" id="consigna"></p>
  </header>

  <section class="actividad" id="actividad">
    <div class="tablero" id="tablero"></div>
    <div class="banco" id="banco"></div>
  </section>

  <section class="resultados" id="resultados" hidden>
    <div class="revision" id="revision"></div>
  </section>

  <div class="pie">
    <div class="dots" id="dots"></div>
    <button class="boton-principal" id="avanzar" disabled></button>
  </div>
</div>

      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  };

  // el alto manda: de ahí sale el lado del cuadrado y el ancho de la columna
  function cuadrar() {
    const tab = $("#tablero");
    if (!tab || !tab.children.length) return;
    const piezas = tab.querySelectorAll(".pieza");
    if (window.innerWidth <= 820) {
      piezas.forEach((p) => { p.style.width = ""; });
      return;
    }
    const gap = 18, casillero = 62, aire = 8;
    const porAlto = tab.clientHeight - casillero - aire;
    const porAncho = (tab.clientWidth - gap * (piezas.length - 1)) / piezas.length;
    const lado = Math.max(80, Math.floor(Math.min(porAlto, porAncho)));
    piezas.forEach((p) => { p.style.width = lado + "px"; });
  }

  window.addEventListener("resize", cuadrar);

  let pantalla = 0;
  let elegida = null;        // palabra seleccionada
  let colocado = {};         // idFoto -> idPalabra puesta ahí
  let verificado = false;
  const historial = {};      // idPalabra -> true si estaba bien al verificar

  const itemPorId = (id) => PANTALLAS[pantalla].items.find((i) => i.id === id);

  function pintarDots() {
    $("#dots").innerHTML = PANTALLAS.map((_, i) => {
      const cls = i < pantalla ? "dot lista" : (i === pantalla ? "dot is-active" : "dot");
      return `<span class="${cls}"></span>`;
    }).join("");
  }

  const HUECO_VACIO = `<span class="vacio">¿cuál es?</span><span class="vacio-en">which one?</span>`;
  const HUECO_LISTO = `<span class="vacio">poné acá</span><span class="vacio-en">put it here</span>`;

  function pintarCasillero(pieza) {
    const cas = pieza.querySelector(".casillero");
    const puesta = colocado[pieza.dataset.id];
    if (!puesta) {
      cas.innerHTML = pieza.classList.contains("elegible") ? HUECO_LISTO : HUECO_VACIO;
      return;
    }
    const item = itemPorId(puesta);
    cas.innerHTML = `<span class="palabra-puesta">${item.en}</span>
      <span class="quitar">tocá para sacar · tap to remove</span>`;
  }

  // cuando ya están todas puestas el banco queda vacío: ahí avisa qué sigue
  function pintarBanco() {
    const banco = $("#banco");
    const total = PANTALLAS[pantalla].items.length;
    const completo = !verificado && Object.keys(colocado).length === total;
    banco.classList.toggle("completo", completo);
    const aviso = banco.querySelector(".aviso");
    if (aviso) aviso.hidden = !completo;
  }

  function actualizarBoton() {
    const b = $("#avanzar");
    const total = PANTALLAS[pantalla].items.length;
    pintarBanco();
    if (!verificado) {
      b.disabled = Object.keys(colocado).length < total;
      b.innerHTML = `Verificar <span class="en">· Check</span>`;
      return;
    }
    b.disabled = false;
    b.innerHTML = pantalla === PANTALLAS.length - 1
      ? `Ver resultados <span class="en">· Results</span>`
      : `Avanzar <span class="en">· Next</span>`;
  }

  function render() {
    const p = PANTALLAS[pantalla];
    $("#app").dataset.grupo = p.grupo;
    $("#icono").innerHTML = ICONOS[p.grupo];
    $("#titulo").innerHTML = `${p.titulo} <span class="en">${p.tituloEn}</span>`;
    $("#sub").textContent = p.sub;
    $("#consigna").innerHTML = CONSIGNA;
    elegida = null;
    colocado = {};
    verificado = false;

    $("#tablero").innerHTML = mezclar(p.items).map((it) => `
      <div class="pieza" data-id="${it.id}">
        <button class="foto" type="button" aria-label="Foto de ${it.en}">
          <img src="${FOTOS[it.id]}" alt="">
        </button>
        <button class="casillero" type="button" aria-label="Poner la palabra acá">${HUECO_VACIO}</button>
      </div>`).join("");

    $("#banco").classList.remove("completo");
    $("#banco").innerHTML = mezclar(p.items).map((it) => `
      <button class="palabra" type="button" data-id="${it.id}" aria-pressed="false">${it.en}</button>`).join("")
      + `<p class="aviso" hidden>Ya están las tres. Tocá <b>Verificar</b>.
         <span>All three are placed. Tap <b>Check</b>.</span></p>`;

    cuadrar();
    actualizarBoton();
    pintarDots();
  }

  function limpiarSeleccion() {
    elegida = null;
    todos$(".palabra").forEach((b) => b.setAttribute("aria-pressed", "false"));
    todos$(".pieza").forEach((d) => { d.classList.remove("elegible"); pintarCasillero(d); });
  }

  function elegirPalabra(boton) {
    if (verificado) return;
    const id = boton.dataset.id;
    const yaEstaba = elegida === id;
    limpiarSeleccion();
    if (yaEstaba) return;
    elegida = id;
    boton.setAttribute("aria-pressed", "true");
    todos$(".pieza").forEach((d) => { d.classList.add("elegible"); pintarCasillero(d); });
  }

  function devolverAlBanco(idPalabra) {
    const chip = document.querySelector(`.palabra[data-id="${idPalabra}"]`);
    if (chip) { chip.classList.remove("usada"); chip.disabled = false; }
  }

  function tocarPieza(pieza) {
    if (verificado) return;
    const idFoto = pieza.dataset.id;

    // sin palabra elegida: tocar un casillero lleno lo vacía
    if (!elegida) {
      if (colocado[idFoto]) {
        devolverAlBanco(colocado[idFoto]);
        delete colocado[idFoto];
        pieza.classList.remove("puesta");
        pintarCasillero(pieza);
        actualizarBoton();
      }
      return;
    }

    const nueva = elegida;

    // si esa palabra ya estaba en otro casillero, se la saca de ahí
    Object.keys(colocado).forEach((k) => {
      if (colocado[k] === nueva) {
        delete colocado[k];
        const otra = document.querySelector(`.pieza[data-id="${k}"]`);
        otra.classList.remove("puesta");
      }
    });
    // y si el casillero destino tenía otra, esa vuelve al banco
    if (colocado[idFoto]) devolverAlBanco(colocado[idFoto]);

    colocado[idFoto] = nueva;
    const chip = document.querySelector(`.palabra[data-id="${nueva}"]`);
    chip.classList.add("usada");
    chip.disabled = true;

    limpiarSeleccion();
    todos$(".pieza").forEach((d) => {
      d.classList.toggle("puesta", Boolean(colocado[d.dataset.id]));
      pintarCasillero(d);
    });
    actualizarBoton();
  }

  function verificar() {
    verificado = true;
    limpiarSeleccion();

    todos$(".pieza").forEach((pieza) => {
      const idFoto = pieza.dataset.id;
      const puesta = colocado[idFoto];
      const correcta = itemPorId(idFoto);
      const acerto = puesta === idFoto;
      historial[idFoto] = acerto;

      pieza.classList.remove("puesta", "elegible");
      pieza.classList.add("verificada", acerto ? "bien" : "mal");

      const cas = pieza.querySelector(".casillero");
      cas.innerHTML = acerto
        ? `<span class="en">${correcta.en}</span><span class="es">${correcta.es}</span>`
        : `<span class="pusiste">pusiste: ${itemPorId(puesta).en}</span>
           <span class="en">${correcta.en}</span><span class="es">${correcta.es}</span>`;
    });

    const bien = PANTALLAS[pantalla].items.filter((i) => historial[i.id]).length;
    const total = PANTALLAS[pantalla].items.length;
    $("#banco").innerHTML = `<p class="listo">${bien} de ${total} bien.
      <span>${bien} of ${total} correct.</span></p>`;
    actualizarBoton();
  }

  function mostrarResultados() {
    const todos = PANTALLAS.flatMap((p) => p.items.map((i) => ({ ...i, grupo: p.grupo })));
    const bien = todos.filter((i) => historial[i.id]).length;

    $("#app").dataset.grupo = "final";
    $("#icono").innerHTML = ICONOS.final;
    $("#titulo").innerHTML = `Resultados <span class="en">Results</span>`;
    $("#sub").textContent = "";
    $("#consigna").innerHTML =
      `<span class="marcador"><span class="n">${bien}</span><span class="de">de ${todos.length} · of ${todos.length}</span></span>`;
    $("#actividad").hidden = true;
    $("#resultados").hidden = false;

    $("#revision").innerHTML = todos.map((i) => {
      const ok = historial[i.id];
      return `
        <article class="col ${i.grupo} ${ok ? "" : "incorrecta"}">
          <img src="${FOTOS[i.id]}" alt="">
          <div class="col-texto">
            <h3>${i.en}</h3>
            <p class="es">${i.es}</p>
          </div>
          <span class="veredicto">${ok ? "✓" : "✗"}</span>
        </article>`;
    }).join("");

    $("#dots").innerHTML = "";
    const b = $("#avanzar");
    b.innerHTML = `Volver a empezar <span class="en">· Start again</span>`;
    b.disabled = false;
    b.dataset.modo = "reiniciar";
  }

  document.addEventListener("click", (e) => {
    const chip = e.target.closest(".palabra");
    if (chip && !chip.disabled) { elegirPalabra(chip); return; }
    // la foto y el recuadro hacen lo mismo
    const zona = e.target.closest(".foto, .casillero");
    if (zona) { tocarPieza(zona.closest(".pieza")); return; }
  });

  $("#avanzar").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (b.dataset.modo === "reiniciar") {
      Object.keys(historial).forEach((k) => delete historial[k]);
      delete b.dataset.modo;
      pantalla = 0;
      $("#actividad").hidden = false;
      $("#resultados").hidden = true;
      render();
      return;
    }
    if (!verificado) { verificar(); return; }
    if (pantalla < PANTALLAS.length - 1) { pantalla++; render(); }
    else mostrarResultados();
  });

  render();
</script>
</body>
</html>
