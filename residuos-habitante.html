<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad interactiva — Residuos por habitante</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root{
    --navy-1:#152238;
    --navy-2:#1d3050;
    --ink:#1f3350;
    --ink-2:#4a5f7a;
    --muted:#7b8ca3;
    --line:#dfe3e8;
    --green:#1f8a5c;
    --green-bg:#e8f6ee;
    --green-br:#a9dcc2;
    --red:#c0392b;
    --red-bg:#fdecea;
    --red-br:#f2bcb5;
    --grey-cap:#e8eaed;
    --grey-cap-br:#d3d7dd;
  }

  body{ margin:0; font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; }

  .act{
    height:500px;
    max-height:500px;
    background:linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 100%);
    border-radius:14px;
    padding:18px 22px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
  }

  .act__top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .act__kicker{
    font-size:10.5px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; color:#8fa6c4;
  }
  .score{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.10); color:#cfdcee;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px; padding:4px 12px;
    font-size:12px; font-weight:800; white-space:nowrap;
    transition:all .2s ease;
  }
  .score.is-win{ background:var(--green-bg); color:#146b4a; border-color:var(--green-br); }
  .score.is-loss{ background:var(--red-bg); color:#8e2b20; border-color:var(--red-br); }

  /* ---------- TARJETA BLANCA ---------- */
  .card{
    background:#fff;
    border-radius:16px;
    padding:16px 20px;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:auto;
  }

  .q{
    margin:0;
    font-size:16.5px; font-weight:700; color:var(--ink); line-height:1.3;
  }

  .opts{ display:flex; flex-direction:column; gap:7px; }

  .opt{
    display:flex; align-items:flex-start; gap:10px;
    width:100%; text-align:left;
    background:#f7f9fb;
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:9px 12px;
    font-family:inherit; font-size:14px; color:var(--ink-2);
    line-height:1.35;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .opt:hover:not(:disabled){ border-color:#b9c4d1; background:#f1f5f9; }
  .opt:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .opt:disabled{ cursor:default; }

  .opt__key{
    flex:0 0 auto;
    width:24px; height:24px; border-radius:50%;
    background:#e5eaf0; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800;
    transition:all .15s ease;
  }
  .opt__txt{ flex:1 1 auto; padding-top:2px; }
  .opt__mark{ flex:0 0 auto; font-size:16px; font-weight:800; line-height:1.4; opacity:0; }

  .opt.is-sel{ border-color:#8fa3ba; background:#eef3f8; color:var(--ink); }
  .opt.is-sel .opt__key{ background:var(--ink); color:#fff; }

  .opt.is-ok{ border-color:var(--green-br); background:var(--green-bg); color:#14603f; }
  .opt.is-ok .opt__key{ background:var(--green); color:#fff; }
  .opt.is-ok .opt__mark{ opacity:1; color:var(--green); }

  .opt.is-bad{ border-color:var(--red-br); background:var(--red-bg); color:#8e2b20; }
  .opt.is-bad .opt__key{ background:var(--red); color:#fff; }
  .opt.is-bad .opt__mark{ opacity:1; color:var(--red); }

  /* ---------- FEEDBACK ---------- */
  .fb{
    display:none;
    gap:10px;
    align-items:flex-start;
    border-radius:11px;
    padding:9px 12px;
    font-size:13.5px; line-height:1.35;
    border:1.5px solid transparent;
  }
  .fb.is-on{ display:flex; }
  .fb__icon{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:#fff;
  }
  .fb__ttl{ font-weight:800; display:block; margin-bottom:1px; }
  .fb--ok{ background:var(--green-bg); border-color:var(--green-br); color:#14603f; }
  .fb--ok .fb__icon{ background:var(--green); }
  .fb--bad{ background:var(--red-bg); border-color:var(--red-br); color:#8e2b20; }
  .fb--bad .fb__icon{ background:var(--red); }

  /* ---------- BOTONES ---------- */
  .bar{
    display:flex; align-items:center; gap:10px;
    flex:0 0 auto;
    background:var(--grey-cap);
    border:1px solid var(--grey-cap-br);
    border-radius:14px;
    padding:9px 12px;
  }
  .bar__hint{ flex:1 1 auto; font-size:12px; color:#5f6b79; line-height:1.3; }

  .btn{
    flex:0 0 auto;
    border:0; border-radius:10px;
    padding:9px 18px;
    font-family:inherit; font-size:13.5px; font-weight:800;
    cursor:pointer;
    transition:filter .15s ease, opacity .15s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn:hover:not(:disabled){ filter:brightness(1.08); }
  .btn--check{ background:var(--green); color:#fff; }
  .btn--retry{ background:#5a6672; color:#fff; }
  .btn:disabled{ opacity:.42; cursor:not-allowed; }
  .btn[hidden]{ display:none; }

  @media (max-width:640px){
    .act{ padding:14px; height:auto; max-height:none; }
    .card{ padding:14px; }
    .q{ font-size:15px; }
    .opt{ font-size:13px; }
    .bar{ flex-wrap:wrap; }
    .bar__hint{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<section class="act" aria-labelledby="q-title">
  <div class="act__top">
    <span class="act__kicker">Actividad interactiva</span>
    <span class="score" id="score">Puntaje: 0 / 10</span>
  </div>

  <div class="card">
    <h3 class="q" id="q-title">¿Cuál de estas afirmaciones describe mejor lo que observás?</h3>

    <div class="opts" id="opts" role="radiogroup" aria-labelledby="q-title"></div>

    <div class="fb" id="fb" role="status" aria-live="polite">
      <span class="fb__icon" id="fbIcon"></span>
      <span><span class="fb__ttl" id="fbTtl"></span><span id="fbTxt"></span></span>
    </div>
  </div>

  <div class="bar">
    <span class="bar__hint" id="hint">Elegí una opción y presioná «Comprobar».</span>
    <button class="btn btn--check" id="btnCheck" disabled>Comprobar</button>
    <button class="btn btn--retry" id="btnRetry" hidden>Reintentar</button>
  </div>
</section>

<script>
(function(){
  const OPTIONS = [
    {
      k:'A',
      t:'El promedio disminuye de manera continua.',
      ttl:'No exactamente. ',
      fb:'Si recorrés los datos año por año, vas a ver que hay momentos en los que el promedio baja, pero también varios en los que aumenta. Compará especialmente 2009 con 2018 y 2019.'
    },
    {
      k:'B',
      t:'El promedio se mantiene exactamente igual.',
      ttl:'Revisá nuevamente el gráfico. ',
      fb:'Los valores cambian a lo largo del período: algunos años se parecen entre sí, pero el promedio no permanece igual. Observá, por ejemplo, la diferencia entre 2009 y 2018.'
    },
    {
      k:'C',
      t:'Aunque hay subas y bajas, hacia el final del período los valores son mayores que al comienzo.',
      ttl:'¡Exacto! ',
      fb:'Los valores no aumentan todos los años, pero el recorrido permite reconocer una tendencia general: hacia el final del período, el promedio diario por habitante es mayor que al comienzo.'
    },
    {
      k:'D',
      t:'No es posible comparar los distintos años.',
      ttl:'Sí es posible compararlos. ',
      fb:'Todos los datos están expresados con la misma unidad —kilogramos por habitante por día— y corresponden a distintos años del mismo período. Eso permite observar cómo varía el promedio a lo largo del tiempo.'
    }
  ];
  const CORRECT = 'C';
  const POINTS  = 10;   // puntaje máximo
  const PENALTY = 2;    // se descuenta por cada error

  const optsEl  = document.getElementById('opts');
  const fb      = document.getElementById('fb');
  const fbIcon  = document.getElementById('fbIcon');
  const fbTtl   = document.getElementById('fbTtl');
  const fbTxt   = document.getElementById('fbTxt');
  const score   = document.getElementById('score');
  const hint    = document.getElementById('hint');
  const btnCheck= document.getElementById('btnCheck');
  const btnRetry= document.getElementById('btnRetry');

  let selected  = null;
  let locked    = false;
  let available = POINTS;   // puntos en juego
  let solved    = false;

  function paintScore(){
    if (solved) {
      score.textContent = 'Puntaje: ' + available + ' / ' + POINTS;
      score.classList.add('is-win');
      score.classList.remove('is-loss');
    } else {
      score.textContent = 'En juego: ' + available + ' / ' + POINTS + ' pts';
      score.classList.remove('is-win');
    }
  }
  paintScore();

  const buttons = OPTIONS.map(o => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.dataset.key = o.k;
    b.setAttribute('role','radio');
    b.setAttribute('aria-checked','false');
    b.innerHTML =
      '<span class="opt__key">' + o.k + '</span>' +
      '<span class="opt__txt">' + o.t + '</span>' +
      '<span class="opt__mark" aria-hidden="true"></span>';
    b.addEventListener('click', () => {
      if (locked) return;
      selected = o.k;
      buttons.forEach(x => {
        const on = x.dataset.key === o.k;
        x.classList.toggle('is-sel', on);
        x.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      fb.classList.remove('is-on');
      btnCheck.disabled = false;
      hint.textContent = 'Presioná «Comprobar» para verificar tu respuesta.';
    });
    optsEl.appendChild(b);
    return b;
  });

  btnCheck.addEventListener('click', () => {
    if (!selected || locked) return;
    const ok = selected === CORRECT;
    const data = OPTIONS.find(o => o.k === selected);
    const chosen = buttons.find(b => b.dataset.key === selected);

    chosen.classList.remove('is-sel');
    chosen.classList.add(ok ? 'is-ok' : 'is-bad');
    chosen.querySelector('.opt__mark').textContent = ok ? '✓' : '✕';

    fb.classList.remove('fb--ok','fb--bad');
    fb.classList.add('is-on', ok ? 'fb--ok' : 'fb--bad');
    fbIcon.textContent = ok ? '✓' : '✕';
    fbTtl.textContent  = data.ttl;
    fbTxt.textContent  = data.fb;

    // Queda bloqueado en los dos casos: solo «Reintentar» reinicia la actividad.
    locked = true;
    buttons.forEach(b => { b.disabled = true; });
    btnCheck.disabled = true;
    btnRetry.hidden = false;
    btnRetry.focus();

    if (ok) {
      solved = true;
      paintScore();
      hint.textContent = available > 0
        ? 'Respuesta correcta. Sumaste ' + available + ' de ' + POINTS + ' puntos.'
        : 'Respuesta correcta, pero ya no quedaban puntos disponibles.';
      btnRetry.textContent = 'Empezar de nuevo';
    } else {
      available = Math.max(0, available - PENALTY);
      paintScore();
      score.classList.add('is-loss');
      setTimeout(() => score.classList.remove('is-loss'), 900);
      hint.textContent = available > 0
        ? '−' + PENALTY + ' puntos. Quedan ' + available + ' en juego: presioná «Reintentar».'
        : 'Ya no quedan puntos en juego, pero podés seguir intentando.';
      btnRetry.textContent = 'Reintentar';
    }
  });

  btnRetry.addEventListener('click', () => {
    selected = null;
    locked = false;
    buttons.forEach(b => {
      b.disabled = false;
      b.classList.remove('is-sel','is-ok','is-bad');
      b.setAttribute('aria-checked','false');
      b.querySelector('.opt__mark').textContent = '';
    });
    fb.classList.remove('is-on','fb--ok','fb--bad');
    if (solved) {           // ya resuelta: se reinicia toda la actividad
      solved = false;
      available = POINTS;
    }                        // si fue error, el descuento se mantiene
    paintScore();
    btnCheck.disabled = true;
    btnRetry.hidden = true;
    btnRetry.textContent = 'Reintentar';
    hint.textContent = 'Elegí una opción y presioná «Comprobar».';
    optsEl.querySelector('.opt').focus();
  });
})();
</script>
</body>
</html>
