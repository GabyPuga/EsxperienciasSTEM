  *, *::before, *::after{ box-sizing:border-box; }

  :root{
    --navy-1:#003B5F;
    --navy-2:#00517F;
    --ink:#062B44;
    --ink-2:#4a5f7a;
    --muted:#7b8ca3;
    --line:#dfe3e8;
    --c1:#C957DB;
    --c2:#4272D7;
    --c3:#FFCC00;
    --aqua:#8DE2D6;
    --aqua-pastel:#E4F8F4;
    --aqua-br:#B9EDE5;
    --tinta-aqua:#153244;
  }

  body{ margin:0; }

  .caso{
    font-family:'Archivo','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    height:500px; max-height:500px;
    background:linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 100%);
    border-radius:14px;
    padding:14px 20px 12px;
    display:flex; flex-direction:column; gap:9px;
    overflow:hidden;
  }

  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex:0 0 auto; }
  .top__k{
    font-size:10px; font-weight:800; letter-spacing:.16em;
    text-transform:uppercase; color:#8fb6d4;
  }
  .nav{ display:flex; align-items:center; gap:6px; }
  .nav button{
    width:28px; height:28px; border-radius:50%;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.10);
    color:#dbe8f2; font-family:inherit; font-size:14px; font-weight:800; line-height:1;
    cursor:pointer; transition:background .15s ease;
  }
  .nav button:hover{ background:rgba(255,255,255,.2); }
  .nav__i{ font-size:11.5px; font-weight:700; color:#a9c6dc; min-width:34px; text-align:center; }

  /* ---------- tarjeta ---------- */
  .card{
    background:#fff; border-radius:16px;
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  .tabs{ display:flex; gap:0; flex:0 0 auto; border-bottom:1.5px solid var(--line); }
  .tab{
    flex:1 1 0;
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:12px 10px;
    background:none; border:0; border-bottom:3px solid transparent;
    font-family:inherit; font-size:14px; font-weight:700; color:var(--muted);
    cursor:pointer; transition:color .15s ease, background .15s ease, border-color .15s ease;
  }
  .tab:hover{ background:#f6f9fb; color:var(--ink-2); }
  .tab:focus-visible{ outline:2px solid var(--ink); outline-offset:-3px; }
  .tab img{ width:30px; height:30px; border-radius:50%; object-fit:cover; opacity:.6; transition:opacity .15s ease; }
  .tab.is-on{ color:var(--ink); background:#fff; }
  .tab.is-on img{ opacity:1; }
  .tab.is-on.k-c1{ border-bottom-color:var(--c1); }
  .tab.is-on.k-c2{ border-bottom-color:var(--c2); }
  .tab.is-on.k-c3{ border-bottom-color:var(--c3); }

  /* ---------- panel ---------- */
  .panel{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:stretch; gap:26px;
    padding:18px 24px 10px;
  }
  .panel__fig{
    flex:0 0 auto; width:296px; height:100%;
    border-radius:14px; overflow:hidden; background:#eef2f6;
    border:1.5px solid var(--line);
  }
  .panel__fig img{ width:100%; height:100%; object-fit:cover; display:block; }
  .panel__txt{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .panel__t{ margin:0; font-size:26px; font-weight:800; color:var(--ink); line-height:1.15; }
  .panel__d{ margin:8px 0 0; font-size:16.5px; color:#33475c; line-height:1.4; }

  .mini{ display:flex; align-items:center; gap:9px; margin-top:20px; flex-wrap:wrap; }
  .mini__b{
    border-radius:8px; padding:6px 13px;
    font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    background:#eef2f6; color:var(--ink-2); border:1.5px solid #dbe3ea;
  }
  .mini__b--fin{ background:#fff; }
  .mini__b--q{
    background:var(--aqua); border:1.5px dashed var(--tinta-aqua); color:var(--tinta-aqua);
    font-size:13px; letter-spacing:0;
  }
  .mini__f{ color:#9fb0c0; font-size:15px; line-height:1; }
  .k-c1 .mini__b--fin{ border-color:var(--c1); color:#7d1f8c; }
  .k-c2 .mini__b--fin{ border-color:var(--c2); color:#274b91; }
  .k-c3 .mini__b--fin{ border-color:var(--c3); color:#7a5a00; }

  .puntos{ display:flex; gap:6px; justify-content:center; padding:0 0 12px; flex:0 0 auto; }
  .puntos button{
    width:8px; height:8px; border-radius:50%; border:0; padding:0;
    background:#d3dce4; cursor:pointer; transition:all .15s ease;
  }
  .puntos button.is-on{ width:22px; border-radius:4px; background:var(--ink-2); }

  /* ---------- pregunta ---------- */
  .preg{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--aqua-pastel); border:1px solid var(--aqua-br);
    border-radius:13px; padding:12px 16px; text-align:center;
  }
  .preg__i{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    background:var(--aqua); color:var(--tinta-aqua);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:800;
  }
  .preg__t{ font-size:16px; font-weight:800; color:var(--tinta-aqua); line-height:1.25; }

  @media (max-width:760px){
    .caso{ padding:12px; }
    .tab{ flex-direction:column; gap:4px; font-size:10.5px; padding:9px 4px; }
    .tab img{ width:22px; height:22px; }
    .panel{ gap:14px; padding:12px 14px; }
    .panel__fig{ width:120px; }
    .panel__t{ font-size:17px; }
    .panel__d{ font-size:13px; }
    .mini__b{ font-size:9px; padding:5px 8px; }
    .preg__t{ font-size:13px; }
  }
</style>
</head>
<body>

<section class="caso">
  <div class="top">
    <span class="top__k">Pensemos un caso</span>
    <div class="nav">
      <button id="prev" aria-label="Caso anterior">‹</button>
      <span class="nav__i" id="ind">1 / 3</span>
      <button id="next" aria-label="Caso siguiente">›</button>
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
    <div class="puntos" id="puntos"></div>
  </div>

  <div class="preg">
    <span class="preg__i" aria-hidden="true">?</span>
    <span class="preg__t">¿Ese es necesariamente el final de cada objeto?</span>
  </div>
</section>

  const tabs = document.getElementById('tabs');
  const panel = document.getElementById('panel');
  const puntos = document.getElementById('puntos');
  const ind = document.getElementById('ind');
  let i = 0;

  CASOS.forEach((c, n) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab k-' + c.k;
    b.setAttribute('role','tab');
    b.innerHTML = '<img src="' + TH[c.id] + '" alt=""><span>' + c.t + '</span>';
    b.addEventListener('click', () => ver(n));
    tabs.appendChild(b);

    const p = document.createElement('button');
    p.type = 'button';
    p.setAttribute('aria-label','Caso ' + (n+1));
    p.addEventListener('click', () => ver(n));
    puntos.appendChild(p);
  });

  function ver(n){
    i = (n + CASOS.length) % CASOS.length;
    const c = CASOS[i];
    [...tabs.children].forEach((t, k) => {
      t.classList.toggle('is-on', k === i);
      t.setAttribute('aria-selected', k === i ? 'true' : 'false');
    });
    [...puntos.children].forEach((p, k) => p.classList.toggle('is-on', k === i));
    ind.textContent = (i + 1) + ' / ' + CASOS.length;

    panel.className = 'panel k-' + c.k;
    panel.innerHTML =
      '<div class="panel__fig"><img src="' + IMG[c.id] + '" alt="' + c.t + '"></div>' +
      '<div class="panel__txt">' +
        '<h3 class="panel__t">' + c.t + '</h3>' +
        '<p class="panel__d">' + c.d + '</p>' +
        '<div class="mini">' +
          '<span class="mini__b">' + c.uso + '</span>' +
          '<span class="mini__f">→</span>' +
          '<span class="mini__b mini__b--fin">Descarte</span>' +
          '<span class="mini__f">→</span>' +
          '<span class="mini__b mini__b--q">¿y después?</span>' +
        '</div>' +
      '</div>';
  }

  document.getElementById('prev').addEventListener('click', () => ver(i - 1));
  document.getElementById('next').addEventListener('click', () => ver(i + 1));
  tabs.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ ver(i + 1); tabs.children[i].focus(); }
    if (e.key === 'ArrowLeft'){ ver(i - 1); tabs.children[i].focus(); }
  });

  ver(0);
})();
</script>
