<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrastrá cada pista al Mundial correcto</title>
<style>
  :root {
    --ba-azul: #153244;
    --ba-amarillo: #FFCC00;
    --ba-cyan: #8DE2D6;
    --ba-cyan-soft: #C5EFE8;
    --ba-gris: #3C3C3B;
    --ok-bg: #DFF3E4;
    --ok-fg: #1B5E2A;
    --ok-border: #2E7D3D;
    --err-bg: #FBE0E0;
    --err-fg: #8E1A1A;
    --err-border: #C42B2B;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 2rem 1rem;
    background: #FFFFFF;
    color: var(--ba-azul);
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  /* Encabezado con líneas decorativas */
  .header {
    text-align: center;
    margin-bottom: 1.75rem;
    position: relative;
    padding: 1.25rem 0;
  }
  .header::before,
  .header::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    border-radius: 2px;
  }
  .header::before { top: 0; background: var(--ba-azul); }
  .header::after  { bottom: 0; background: var(--ba-cyan); }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 0.5rem;
    color: var(--ba-azul);
    letter-spacing: -0.3px;
  }
  .subtitle {
    color: var(--ba-gris);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 620px;
  }

  /* Stage (área de juego) */
  .stage {
    background: var(--ba-cyan-soft);
    border-radius: 16px;
    padding: 1.5rem;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    position: relative;
    border: 2px solid var(--ba-cyan);
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .stage.ended { padding: 0; border-color: transparent; }
  .stage.ended.perfect {
    background: linear-gradient(135deg, var(--ba-cyan) 0%, #B5EBE2 100%);
    border-color: var(--ba-azul);
  }
  .stage.ended.good {
    background: linear-gradient(135deg, var(--ba-cyan-soft) 0%, var(--ba-cyan) 100%);
    border-color: var(--ba-azul);
  }
  .stage.ended.meh {
    background: linear-gradient(135deg, #FFE680 0%, var(--ba-amarillo) 100%);
    border-color: var(--ba-azul);
  }

  .progress {
    font-size: 12px;
    color: var(--ba-azul);
    position: absolute;
    top: 14px;
    right: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .score-mini {
    font-size: 12px;
    color: var(--ba-azul);
    position: absolute;
    top: 14px;
    left: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .card-slot { display: flex; align-items: center; justify-content: center; min-height: 170px; }
  .feedback {
    font-size: 15px;
    margin-top: 14px;
    min-height: 24px;
    text-align: center;
    font-weight: 700;
  }

  /* Contenedores */
  .bins {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }
  .bin {
    background: #FFFFFF;
    border: 2px dashed var(--ba-azul);
    border-radius: 14px;
    padding: 14px 8px 12px;
    text-align: center;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .bin.over {
    background: #FFF8CC;
    border-color: var(--ba-amarillo);
    border-style: solid;
    border-width: 3px;
    transform: scale(1.03);
  }
  .bin.correct-flash {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    border-style: solid;
  }
  .bin.wrong-flash {
    background: var(--err-bg);
    border-color: var(--err-border);
    border-style: solid;
  }
  .bin-kicker {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--ba-cyan);
    text-transform: uppercase;
    margin-bottom: 2px;
    background: var(--ba-azul);
    padding: 3px 10px;
    border-radius: 100px;
  }
  .bin-year {
    font-size: 30px;
    font-weight: 700;
    color: var(--ba-azul);
    line-height: 1;
    margin: 8px 0 10px;
    letter-spacing: -1px;
  }
  .bin-drops { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .dropped {
    font-size: 10.5px;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1.25;
    word-break: break-word;
    font-weight: 500;
    text-align: center;
  }
  .dropped.ok  { background: var(--ok-bg);  color: var(--ok-fg);  border-left: 3px solid var(--ok-border); }
  .dropped.bad { background: var(--err-bg); color: var(--err-fg); border-left: 3px solid var(--err-border); text-decoration: line-through; }

  /* Tarjeta */
  .card {
    background: #FFFFFF;
    border: 2px solid var(--ba-azul);
    border-radius: 14px;
    padding: 18px 22px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 6px 18px rgba(21,50,68,0.12);
    max-width: 380px;
    text-align: center;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.3; }
  .card-category {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 100px;
  }
  .card-category.tecnologia { background: var(--ba-azul);     color: var(--ba-cyan); }
  .card-category.objeto     { background: var(--ba-amarillo); color: var(--ba-azul); }
  .card-category.curiosidad { background: var(--ba-cyan);     color: var(--ba-azul); }
  .card-category.camiseta   { background: #FFFFFF;            color: var(--ba-azul); border: 2px solid var(--ba-azul); padding: 2px 10px; }
  .card-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ba-azul);
  }

  .card-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    background: #FFFFFF;
    border: 2px solid var(--ba-azul);
    border-radius: 14px;
    padding: 18px 22px;
    max-width: 380px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 16px 32px rgba(21,50,68,0.25);
    transform: rotate(-2deg);
  }

  /* Pantalla final */
  .end-panel {
    display: none;
    padding: 2rem 1.5rem;
    text-align: center;
    width: 100%;
  }
  .end-panel.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .end-emoji { font-size: 56px; line-height: 1; margin-bottom: 8px; }
  .end-title { margin: 0 0 6px; font-size: 26px; font-weight: 700; color: var(--ba-azul); letter-spacing: -0.3px; }
  .end-score {
    margin: 0 0 10px;
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1.5px;
    color: var(--ba-azul);
  }
  .end-score .of { font-size: 24px; color: var(--ba-gris); font-weight: 500; }
  .end-detail { margin: 0 auto 20px; font-size: 15px; color: var(--ba-azul); line-height: 1.5; max-width: 480px; font-weight: 500; }

  button {
    font-family: inherit;
    padding: 12px 32px;
    border: 2px solid var(--ba-azul);
    background: var(--ba-amarillo);
    color: var(--ba-azul);
    border-radius: 100px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 0 var(--ba-azul);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ba-azul); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ba-azul); }

  /* Footer ministerio */
  .footer-mini {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 11px;
    color: var(--ba-gris);
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  @media (max-width: 720px) {
    .bins { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 22px; }
    .bin-year { font-size: 26px; }
    .card, .card-ghost { padding: 14px 16px; max-width: 320px; }
    .card-text { font-size: 15px; }
  }
  @media (max-width: 480px) {
    .bins { grid-template-columns: repeat(2, 1fr); }
    .end-score { font-size: 38px; }
    .end-score .of { font-size: 20px; }
    .end-emoji { font-size: 48px; }
    .end-title { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>Arrastrá cada pista al Mundial correcto</h1>
    <p class="subtitle">Leé cada tarjeta y arrastrala al Mundial al que pertenece según las pistas de los relatos.</p>
  </div>

  <div class="stage" id="stage">
    <div class="score-mini" id="score-mini"></div>
    <div class="progress" id="progress"></div>
    <div class="card-slot" id="card-slot"></div>
    <div class="feedback" id="feedback"></div>

    <div class="end-panel" id="end-panel">
      <div class="end-emoji" id="end-emoji"></div>
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-score" id="end-score"></p>
      <p class="end-detail" id="end-detail"></p>
      <button id="restart">Volver a jugar</button>
    </div>
  </div>

  <div class="bins" id="bins"></div>

</div>

<script>
(function(){
  const CARDS = [
    // Tecnología y comunicación
    { id: 't1930', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Radio con fritura',                            mundial: '1930' },
    { id: 't1958', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Televisor blanco y negro',                     mundial: '1958' },
    { id: 't1978', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Satélites transmitiendo en vivo',              mundial: '1978' },
    { id: 't2002', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Pantalla LCD y transmisión digital',           mundial: '2002' },
    { id: 't2022', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'TikTok, Instagram y WhatsApp',                 mundial: '2022' },

    // Objetos de la época
    { id: 'o1930', cat: 'objeto',      catLabel: 'Objeto',      text: 'Diario doblado bajo el brazo',                 mundial: '1930' },
    { id: 'o1958', cat: 'objeto',      catLabel: 'Objeto',      text: 'Todas las TV en blanco y negro',               mundial: '1958' },
    { id: 'o1978', cat: 'objeto',      catLabel: 'Objeto',      text: 'Primeras TV a color en Europa',                mundial: '1978' },
    { id: 'o2002', cat: 'objeto',      catLabel: 'Objeto',      text: 'Control remoto y TV plana',                    mundial: '2002' },
    { id: 'o2022', cat: 'objeto',      catLabel: 'Objeto',      text: 'Smartphone',                                   mundial: '2022' },

    // Curiosidades
    { id: 'c1930', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Se jugaron partidos con dos pelotas',          mundial: '1930' },
    { id: 'c1958', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Argentina usó camiseta amarilla prestada',     mundial: '1958' },
    { id: 'c1978', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Primera Copa del Mundo ganada por Argentina',  mundial: '1978' },
    { id: 'c2002', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Primer Mundial organizado en Asia',            mundial: '2002' },
    { id: 'c2022', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Argentina consiguió la tercera estrella',      mundial: '2022' },

    // Camiseta
    { id: 'm1930', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Lana con cuello de cordones',                  mundial: '1930' },
    { id: 'm1958', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Bastones anchos y cuello en V',                mundial: '1958' },
    { id: 'm1978', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Escudo bordado y diseño clásico',              mundial: '1978' },
    { id: 'm2002', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Tela técnica liviana',                         mundial: '2002' },
    { id: 'm2022', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Tres estrellas y Sol de Mayo',                 mundial: '2022' }
  ];
  const BINS = ['1930','1958','1978','2002','2022'];
  const DECK_SIZE = 12;

  const deck = CARDS.slice().sort(() => Math.random() - 0.5).slice(0, DECK_SIZE);
  let idx = 0;
  let correct = 0;

  const binsEl = document.getElementById('bins');
  BINS.forEach(year => {
    const b = document.createElement('div');
    b.className = 'bin';
    b.dataset.bin = year;
    b.innerHTML =
      '<div class="bin-kicker">Mundial</div>' +
      '<div class="bin-year">' + year + '</div>' +
      '<div class="bin-drops" data-drops="'+year+'"></div>';
    binsEl.appendChild(b);
  });

  const slot = document.getElementById('card-slot');
  const feedback = document.getElementById('feedback');
  const progress = document.getElementById('progress');
  const scoreMini = document.getElementById('score-mini');

  function buildCardContent(target, card){
    target.innerHTML = '';
    const cat = document.createElement('div');
    cat.className = 'card-category ' + card.cat;
    cat.textContent = card.catLabel;
    target.appendChild(cat);
    const txt = document.createElement('div');
    txt.className = 'card-text';
    txt.textContent = card.text;
    target.appendChild(txt);
  }

  function renderCard(){
    slot.innerHTML = '';
    feedback.textContent = '';
    if (idx >= deck.length){ finish(); return; }
    progress.textContent = 'Tarjeta ' + (idx+1) + '/' + deck.length;
    scoreMini.textContent = 'Aciertos: ' + correct;
    const card = deck[idx];
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;
    buildCardContent(el, card);
    slot.appendChild(el);
    attachDrag(el, card);
  }

  function attachDrag(el, card){
    let ghost = null;
    let activeBin = null;

    function start(clientX, clientY){
      el.classList.add('dragging');
      ghost = document.createElement('div');
      ghost.className = 'card-ghost';
      buildCardContent(ghost, card);
      document.body.appendChild(ghost);
      move(clientX, clientY);
    }
    function move(clientX, clientY){
      if (!ghost) return;
      ghost.style.left = (clientX - ghost.offsetWidth/2) + 'px';
      ghost.style.top = (clientY - ghost.offsetHeight/2) + 'px';
      const under = document.elementFromPoint(clientX, clientY);
      const bin = under ? under.closest('.bin') : null;
      if (bin !== activeBin){
        if (activeBin) activeBin.classList.remove('over');
        activeBin = bin;
        if (activeBin) activeBin.classList.add('over');
      }
    }
    function end(){
      el.classList.remove('dragging');
      if (ghost) { ghost.remove(); ghost = null; }
      const bin = activeBin;
      if (activeBin) { activeBin.classList.remove('over'); activeBin = null; }
      if (!bin) return;
      const year = bin.dataset.bin;
      const isCorrect = year === card.mundial;
      const drops = bin.querySelector('.bin-drops');
      const tag = document.createElement('span');
      tag.className = 'dropped ' + (isCorrect ? 'ok' : 'bad');
      tag.textContent = card.text;
      drops.appendChild(tag);
      bin.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
      setTimeout(() => bin.classList.remove('correct-flash','wrong-flash'), 500);
      if (isCorrect){
        correct++;
        feedback.innerHTML = '<span style="color: var(--ok-fg);">✓ ¡Correcto!</span>';
      } else {
        feedback.innerHTML = '<span style="color: var(--err-fg);">✗ Era el Mundial ' + card.mundial + '</span>';
      }
      idx++;
      scoreMini.textContent = 'Aciertos: ' + correct;
      setTimeout(renderCard, 800);
    }

    el.addEventListener('mousedown', e => {
      e.preventDefault();
      start(e.clientX, e.clientY);
      const onMove = ev => move(ev.clientX, ev.clientY);
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        end();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      start(t.clientX, t.clientY);
      const onMove = ev => { const tt = ev.touches[0]; move(tt.clientX, tt.clientY); };
      const onUp = () => {
        el.removeEventListener('touchmove', onMove);
        el.removeEventListener('touchend', onUp);
        end();
      };
      el.addEventListener('touchmove', onMove, { passive: false });
      el.addEventListener('touchend', onUp);
    }, { passive: false });
  }

  function finish(){
    progress.textContent = '';
    scoreMini.textContent = '';
    slot.style.display = 'none';
    feedback.style.display = 'none';
    const stage = document.getElementById('stage');
    const panel = document.getElementById('end-panel');
    stage.classList.remove('ended','perfect','good','meh');

    const total = deck.length;
    const pct = correct / total;
    let emoji, title, detail, klass;
    if (pct === 1) {
      emoji = '🏆'; title = '¡Campeón del mundo!';
      detail = 'Acertaste todas las pistas. Te sabés la historia de los Mundiales al dedillo.';
      klass = 'perfect';
    } else if (pct >= 0.75) {
      emoji = '⚽'; title = '¡Muy bien jugado!';
      detail = 'Casi todas justas. Un par para repasar y la próxima la rompés.';
      klass = 'good';
    } else if (pct >= 0.5) {
      emoji = '👏'; title = 'Buen partido';
      detail = 'Acertaste más de la mitad. Repasá los relatos y volvé a intentarlo.';
      klass = 'good';
    } else {
      emoji = '📻'; title = 'A repasar los relatos';
      detail = 'Cada Mundial tiene sus pistas características. Volvé a intentarlo.';
      klass = 'meh';
    }
    stage.classList.add('ended', klass);
    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
    document.getElementById('end-score').innerHTML = correct + ' <span class="of">de ' + total + '</span>';
    document.getElementById('end-detail').textContent = detail;
    panel.classList.add('show');
  }

  document.getElementById('restart').addEventListener('click', () => {
    const fresh = CARDS.slice().sort(() => Math.random() - 0.5).slice(0, DECK_SIZE);
    deck.length = 0;
    fresh.forEach(c => deck.push(c));
    idx = 0; correct = 0;
    document.querySelectorAll('.bin-drops').forEach(d => d.innerHTML = '');
    const stage = document.getElementById('stage');
    const panel = document.getElementById('end-panel');
    stage.classList.remove('ended','perfect','good','meh');
    panel.classList.remove('show');
    slot.style.display = '';
    feedback.style.display = '';
    renderCard();
  });

  renderCard();
})();
</script>
</body>
</html>
