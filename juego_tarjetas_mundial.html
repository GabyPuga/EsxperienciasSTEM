<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrastrá cada pista al Mundial correcto</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    margin: 0;
    padding: 2rem 1rem;
    background: #FAF9F5;
    color: #1F1E1D;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; text-align: center; margin: 0 0 0.5rem; }
  .subtitle { text-align: center; color: #6B6A66; font-size: 15px; line-height: 1.6; margin: 0 auto 2rem; max-width: 620px; }

  .stage {
    background: #F1EFE8;
    border-radius: 16px;
    padding: 1.5rem;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    position: relative;
    transition: background 0.4s ease;
  }
  .stage.ended { padding: 0; }
  .stage.ended.perfect { background: linear-gradient(135deg, #E1F5EE 0%, #C8EBDD 100%); }
  .stage.ended.good    { background: linear-gradient(135deg, #E6F1FB 0%, #CFE3F6 100%); }
  .stage.ended.meh     { background: linear-gradient(135deg, #FAEEDA 0%, #F5DDB0 100%); }
  .progress { font-size: 13px; color: #888780; position: absolute; top: 14px; right: 18px; font-weight: 500; }
  .score-mini { font-size: 13px; color: #888780; position: absolute; top: 14px; left: 18px; font-weight: 500; }
  .card-slot { display: flex; align-items: center; justify-content: center; min-height: 170px; }
  .feedback { font-size: 15px; margin-top: 14px; min-height: 24px; text-align: center; font-weight: 500; }

  .bins {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }
  .bin {
    background: #FFFFFF;
    border: 2px dashed #C7C5BC;
    border-radius: 14px;
    padding: 16px 8px 12px;
    text-align: center;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .bin.over {
    background: #E6F1FB;
    border-color: #378ADD;
    border-style: solid;
    transform: scale(1.03);
  }
  .bin.correct-flash { background: #E1F5EE; border-color: #1D9E75; border-style: solid; }
  .bin.wrong-flash { background: #FCEBEB; border-color: #E24B4A; border-style: solid; }

  .bin-kicker {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #888780;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .bin-year {
    font-size: 28px;
    font-weight: 700;
    color: #1F1E1D;
    line-height: 1;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .bin-drops { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .dropped {
    font-size: 10.5px;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1.25;
    word-break: break-word;
    font-weight: 500;
    text-align: center;
  }
  .dropped.ok { background: #E1F5EE; color: #085041; }
  .dropped.bad { background: #FCEBEB; color: #791F1F; }

  .card {
    background: #FFFFFF;
    border: 1px solid #D3D1C7;
    border-radius: 14px;
    padding: 18px 22px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    max-width: 380px;
    text-align: center;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.3; }
  .card-category {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
  }
  .card-category.tecnologia { background: #E6F1FB; color: #0C447C; }
  .card-category.objeto    { background: #FAEEDA; color: #854F0B; }
  .card-category.curiosidad{ background: #EEEDFE; color: #3C3489; }
  .card-category.camiseta  { background: #FAECE7; color: #993C1D; }
  .card-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    color: #1F1E1D;
  }

  .card-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    background: #FFFFFF;
    border: 1px solid #888780;
    border-radius: 14px;
    padding: 18px 22px;
    max-width: 380px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    transform: rotate(-2deg);
  }

  .end-panel {
    display: none;
    padding: 2rem 1.5rem;
    text-align: center;
    width: 100%;
  }
  .end-panel.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .end-emoji { font-size: 56px; line-height: 1; margin-bottom: 8px; }
  .end-title { margin: 0 0 6px; font-size: 24px; font-weight: 700; color: #1F1E1D; }
  .end-score {
    margin: 0 0 10px;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
  }
  .end-score .of { font-size: 24px; color: #6B6A66; font-weight: 500; }
  .stage.ended.perfect .end-score { color: #085041; }
  .stage.ended.good    .end-score { color: #0C447C; }
  .stage.ended.meh     .end-score { color: #854F0B; }
  .end-detail { margin: 0 auto 18px; font-size: 15px; color: #444441; line-height: 1.5; max-width: 480px; }
  button {
    font: inherit;
    padding: 12px 28px;
    border: none;
    background: #1F1E1D;
    color: #FFFFFF;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }

  @media (max-width: 720px) {
    .bins { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 22px; }
    .bin-year { font-size: 24px; }
    .card, .card-ghost { padding: 14px 16px; max-width: 320px; }
    .card-text { font-size: 15px; }
  }
  @media (max-width: 480px) {
    .bins { grid-template-columns: repeat(2, 1fr); }
    .end-score { font-size: 36px; }
    .end-score .of { font-size: 20px; }
    .end-emoji { font-size: 48px; }
    .end-title { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Arrastrá cada pista al Mundial correcto</h1>
  <p class="subtitle">Leé cada tarjeta y arrastrala al Mundial al que pertenece según las pistas de los relatos.</p>

  <div class="stage" id="stage">
    <div class="score-mini" id="score-mini"></div>
    <div class="progress" id="progress"></div>
    <div class="card-slot" id="card-slot"></div>
    <div class="feedback" id="feedback"></div>

    <div class="end-panel" id="end-panel">
      <div class="end-emoji" id="end-emoji"></div>
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-score" id="end-score"></p>
      <p class="end-detail" id="end-detail"></p>
      <button id="restart">Volver a jugar</button>
    </div>
  </div>

  <div class="bins" id="bins"></div>

</div>

<script>
(function(){
  const CARDS = [
    // Tecnología y comunicación
    { id: 't1930', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Radio con fritura',                            mundial: '1930' },
    { id: 't1958', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Televisor blanco y negro',                     mundial: '1958' },
    { id: 't1978', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Satélites transmitiendo en vivo',              mundial: '1978' },
    { id: 't2002', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'Pantalla LCD y transmisión digital',           mundial: '2002' },
    { id: 't2022', cat: 'tecnologia',  catLabel: 'Tecnología',  text: 'TikTok, Instagram y WhatsApp',                 mundial: '2022' },

    // Objetos de la época
    { id: 'o1930', cat: 'objeto',      catLabel: 'Objeto',      text: 'Diario doblado bajo el brazo',                 mundial: '1930' },
    { id: 'o1958', cat: 'objeto',      catLabel: 'Objeto',      text: 'Radio encendida en el barrio',                 mundial: '1958' },
    { id: 'o1978', cat: 'objeto',      catLabel: 'Objeto',      text: 'Televisor familiar',                           mundial: '1978' },
    { id: 'o2002', cat: 'objeto',      catLabel: 'Objeto',      text: 'Control remoto y TV plana',                    mundial: '2002' },
    { id: 'o2022', cat: 'objeto',      catLabel: 'Objeto',      text: 'Smartphone',                                   mundial: '2022' },

    // Curiosidades
    { id: 'c1930', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Se jugaron partidos con dos pelotas',          mundial: '1930' },
    { id: 'c1958', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Argentina usó camiseta amarilla prestada',     mundial: '1958' },
    { id: 'c1978', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Primera Copa del Mundo ganada por Argentina',  mundial: '1978' },
    { id: 'c2002', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Primer Mundial organizado en Asia',            mundial: '2002' },
    { id: 'c2022', cat: 'curiosidad',  catLabel: 'Curiosidad',  text: 'Argentina consiguió la tercera estrella',      mundial: '2022' },

    // Camiseta
    { id: 'm1930', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Lana con cuello de cordones',                  mundial: '1930' },
    { id: 'm1958', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Bastones anchos y cuello en V',                mundial: '1958' },
    { id: 'm1978', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Escudo bordado y diseño clásico',              mundial: '1978' },
    { id: 'm2002', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Tela técnica liviana',                         mundial: '2002' },
    { id: 'm2022', cat: 'camiseta',    catLabel: 'Camiseta',    text: 'Tres estrellas y Sol de Mayo',                 mundial: '2022' }
  ];
  const BINS = ['1930','1958','1978','2002','2022'];

  const DECK_SIZE = 12;
  const deck = CARDS.slice().sort(() => Math.random() - 0.5).slice(0, DECK_SIZE);
  let idx = 0;
  let correct = 0;

  const binsEl = document.getElementById('bins');
  BINS.forEach(year => {
    const b = document.createElement('div');
    b.className = 'bin';
    b.dataset.bin = year;
    b.innerHTML =
      '<div class="bin-kicker">Mundial</div>' +
      '<div class="bin-year">' + year + '</div>' +
      '<div class="bin-drops" data-drops="'+year+'"></div>';
    binsEl.appendChild(b);
  });

  const slot = document.getElementById('card-slot');
  const feedback = document.getElementById('feedback');
  const progress = document.getElementById('progress');
  const scoreMini = document.getElementById('score-mini');

  function buildCardContent(target, card){
    target.innerHTML = '';
    const cat = document.createElement('div');
    cat.className = 'card-category ' + card.cat;
    cat.textContent = card.catLabel;
    target.appendChild(cat);
    const txt = document.createElement('div');
    txt.className = 'card-text';
    txt.textContent = card.text;
    target.appendChild(txt);
  }

  function renderCard(){
    slot.innerHTML = '';
    feedback.textContent = '';
    if (idx >= deck.length){ finish(); return; }
    progress.textContent = 'Tarjeta ' + (idx+1) + ' de ' + deck.length;
    scoreMini.textContent = 'Aciertos: ' + correct;
    const card = deck[idx];
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;
    buildCardContent(el, card);
    slot.appendChild(el);
    attachDrag(el, card);
  }

  function attachDrag(el, card){
    let ghost = null;
    let activeBin = null;

    function start(clientX, clientY){
      el.classList.add('dragging');
      ghost = document.createElement('div');
      ghost.className = 'card-ghost';
      buildCardContent(ghost, card);
      document.body.appendChild(ghost);
      move(clientX, clientY);
    }
    function move(clientX, clientY){
      if (!ghost) return;
      ghost.style.left = (clientX - ghost.offsetWidth/2) + 'px';
      ghost.style.top = (clientY - ghost.offsetHeight/2) + 'px';
      const under = document.elementFromPoint(clientX, clientY);
      const bin = under ? under.closest('.bin') : null;
      if (bin !== activeBin){
        if (activeBin) activeBin.classList.remove('over');
        activeBin = bin;
        if (activeBin) activeBin.classList.add('over');
      }
    }
    function end(){
      el.classList.remove('dragging');
      if (ghost) { ghost.remove(); ghost = null; }
      const bin = activeBin;
      if (activeBin) { activeBin.classList.remove('over'); activeBin = null; }
      if (!bin) return;
      const year = bin.dataset.bin;
      const isCorrect = year === card.mundial;
      const drops = bin.querySelector('.bin-drops');
      const tag = document.createElement('span');
      tag.className = 'dropped ' + (isCorrect ? 'ok' : 'bad');
      tag.textContent = card.text;
      drops.appendChild(tag);
      bin.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
      setTimeout(() => bin.classList.remove('correct-flash','wrong-flash'), 500);
      if (isCorrect){
        correct++;
        feedback.innerHTML = '<span style="color: #085041;">✓ ¡Correcto!</span>';
      } else {
        feedback.innerHTML = '<span style="color: #791F1F;">✗ Era el Mundial ' + card.mundial + '</span>';
      }
      idx++;
      scoreMini.textContent = 'Aciertos: ' + correct;
      setTimeout(renderCard, 800);
    }

    el.addEventListener('mousedown', e => {
      e.preventDefault();
      start(e.clientX, e.clientY);
      const onMove = ev => move(ev.clientX, ev.clientY);
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        end();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      start(t.clientX, t.clientY);
      const onMove = ev => { const tt = ev.touches[0]; move(tt.clientX, tt.clientY); };
      const onUp = () => {
        el.removeEventListener('touchmove', onMove);
        el.removeEventListener('touchend', onUp);
        end();
      };
      el.addEventListener('touchmove', onMove, { passive: false });
      el.addEventListener('touchend', onUp);
    }, { passive: false });
  }

  function finish(){
    progress.textContent = '';
    scoreMini.textContent = '';
    slot.style.display = 'none';
    feedback.style.display = 'none';
    const stage = document.getElementById('stage');
    const panel = document.getElementById('end-panel');
    stage.classList.remove('ended','perfect','good','meh');

    const total = deck.length;
    const pct = correct / total;
    let emoji, title, detail, klass;
    if (pct === 1) {
      emoji = '🏆'; title = '¡Campeón del mundo!';
      detail = 'Acertaste todas las pistas. Te sabés la historia de los Mundiales al dedillo.';
      klass = 'perfect';
    } else if (pct >= 0.75) {
      emoji = '⚽'; title = '¡Muy bien jugado!';
      detail = 'Casi todas justas. Un par para repasar y la próxima la rompés.';
      klass = 'good';
    } else if (pct >= 0.5) {
      emoji = '👏'; title = 'Buen partido';
      detail = 'Acertaste más de la mitad. Repasá los relatos y volvé a intentarlo.';
      klass = 'good';
    } else {
      emoji = '📻'; title = 'A repasar los relatos';
      detail = 'Cada Mundial tiene sus pistas características. Volvé a intentarlo.';
      klass = 'meh';
    }
    stage.classList.add('ended', klass);
    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
    document.getElementById('end-score').innerHTML = correct + ' <span class="of">de ' + total + '</span>';
    document.getElementById('end-detail').textContent = detail;
    panel.classList.add('show');
  }

  document.getElementById('restart').addEventListener('click', () => {
    const fresh = CARDS.slice().sort(() => Math.random() - 0.5).slice(0, DECK_SIZE);
    deck.length = 0;
    fresh.forEach(c => deck.push(c));
    idx = 0; correct = 0;
    document.querySelectorAll('.bin-drops').forEach(d => d.innerHTML = '');
    const stage = document.getElementById('stage');
    const panel = document.getElementById('end-panel');
    stage.classList.remove('ended','perfect','good','meh');
    panel.classList.remove('show');
    slot.style.display = '';
    feedback.style.display = '';
    renderCard();
  });

  renderCard();
})();
</script>
</body>
</html>
