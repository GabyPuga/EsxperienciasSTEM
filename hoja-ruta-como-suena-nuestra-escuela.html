  *, *::before, *::after{ box-sizing:border-box; }

  :root{
    --navy:#00456E;
    --navy-d:#003B5F;
    --c1:#C957DB;   /* punto de partida */
    --c2:#4272D7;   /* indagacion (2 y 3) */
    --c3:#FFCC00;   /* produccion */
    --c4:#42D789;   /* evaluacion */
    --tinta:#062B44;
  }

  body{ margin:0; }

  .exp{
    position:relative; overflow:hidden;
    font-family:'Archivo','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--navy);
    height:500px; max-height:500px;
    display:flex; flex-direction:column;
    padding:14px 26px 12px;
  }

  .deco-circ{ position:absolute; top:-16px; right:64px; height:78px; pointer-events:none; }
  .deco-arco{ position:absolute; right:0; bottom:0; height:96px; pointer-events:none; }

  /* ---------- encabezado ---------- */
  .hd{ position:relative; z-index:2; display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex:0 0 auto; }
  .hd__txt{ flex:1 1 auto; min-width:0; }
  .hd__t{
    margin:0; font-size:27px; font-weight:800; line-height:1.14;
    color:#fff; letter-spacing:-.2px;
  }
  .hd__t span{ color:#fff; }
  .hd__desafio{
    margin:7px 0 0; font-size:15px; font-weight:700; line-height:1.25;
    color:#8DE2D6; max-width:72ch;
  }
  .hd__desafio b{ font-weight:800; letter-spacing:.04em; }
  .hd__stem{ height:50px; width:auto; display:block; }

  /* ---------- fotos ---------- */
  .fotos{
    position:relative; z-index:2;
    flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px;
    margin-top:10px;
  }
  .fotos figure{ margin:0; overflow:hidden; background:#023553; }
  .fotos img{ width:100%; height:100%; object-fit:cover; object-position:center 45%; display:block; }

  /* ---------- momentos ---------- */
  .steps{
    position:relative; z-index:2;
    flex:0 0 auto; height:128px;
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px;
    padding-top:16px; margin-top:8px;
  }
  .steps::before{
    content:''; position:absolute; top:31px;
    left:10%; right:10%; height:2px; background:rgba(255,255,255,.5);
  }

  .st{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:0 5px;
    background:none; border:0;
    border-left:1px solid rgba(255,255,255,.15);
    font-family:inherit; color:#fff; text-align:center;
    cursor:pointer; transition:background .16s ease;
  }
  .st:first-child{ border-left:0; }
  .st:hover{ background:rgba(255,255,255,.06); }
  .st:focus-visible{ outline:3px solid #fff; outline-offset:-3px; }

  .st__n{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800;
    box-shadow:0 0 0 4px var(--navy);
    transition:transform .16s ease;
  }
  .st:hover .st__n{ transform:scale(1.12); }

  .st__t{
    font-size:12.5px; font-weight:700; line-height:1.18; color:#fff;
    height:3.54em; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }
  .st__cap{
    display:inline-block; border-radius:999px; white-space:nowrap;
    padding:5px 12px;
    font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .st:hover .st__cap{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.32); }

  .st--c1 .st__n, .st--c1 .st__cap{ background:var(--c1); color:#fff; }
  .st--c2 .st__n, .st--c2 .st__cap{ background:var(--c2); color:#fff; }
  .st--c3 .st__n, .st--c3 .st__cap{ background:var(--c3); color:var(--tinta); }
  .st--c4 .st__n, .st--c4 .st__cap{ background:var(--c4); color:var(--tinta); }

  /* ---------- pie ---------- */
  .pie{ position:relative; z-index:2; flex:0 0 auto; display:flex; align-items:center; padding-top:8px; }
  .pie img{ height:28px; width:auto; display:block; }
  .pie__tag{ margin-left:18px; padding-left:18px; border-left:1px solid rgba(255,255,255,.28);
    font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#8DE2D6; }

  /* ---------- ventana emergente ---------- */
  .ov{
    position:fixed; inset:0; z-index:60;
    background:rgba(2,25,42,.74);
    display:none; align-items:center; justify-content:center; padding:22px;
  }
  .ov.is-on{ display:flex; }
  .md{
    width:min(680px,100%); max-height:100%;
    background:#fff; border-radius:18px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 22px 60px rgba(0,0,0,.45);
    font-family:'Archivo','Segoe UI',system-ui,Arial,sans-serif;
  }
  .md__top{ height:9px; flex:0 0 auto; }
  .md__hd{ display:flex; align-items:flex-start; gap:13px; padding:18px 20px 12px; }
  .md__n{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; font-weight:800;
  }
  .md__ttl{ margin:0; font-size:21px; font-weight:800; color:var(--tinta); line-height:1.2; }
  .md__cap{
    display:inline-block; margin-top:8px; border-radius:999px; padding:5px 15px;
    font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  }
  .md__x{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%;
    border:0; background:#eef2f6; color:#3d556b;
    font-size:17px; font-weight:700; cursor:pointer; line-height:1; font-family:inherit;
  }
  .md__x:hover{ background:#dde5ec; }
  .md__bd{ padding:0 20px 16px; overflow:auto; font-size:15px; color:#33475c; line-height:1.5; }
  .md__bd p{ margin:0 0 13px; }
  .md__sub{
    font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:#6b8299; margin:0 0 7px;
  }
  .md__bd ul{ margin:0; padding-left:19px; }
  .md__bd li{ margin-bottom:5px; }
  .md__ft{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 20px; background:#f4f7fa;
  }
  .md__step{ font-size:12px; font-weight:700; color:#6b8299; }
  .md__nav{ display:flex; gap:8px; }
  .md__nav button{
    border:0; border-radius:9px; padding:8px 15px;
    background:var(--navy); color:#fff;
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .md__nav button:disabled{ opacity:.34; cursor:not-allowed; }

  @media (max-width:900px){
    .exp{ padding:12px 14px 10px; }
    .hd__t{ font-size:18px; }
    .hd__desafio{ font-size:12px; }
    .hd__stem{ height:40px; }
    .deco-circ{ height:52px; right:90px; }
    .deco-arco{ height:80px; }
    .steps{ height:128px; }
    .st{ padding:0 3px; min-width:0; }
    .st__t{ font-size:10px; -webkit-line-clamp:4; height:4.72em; }
    .pie__tag{ display:none; }
    .st__cap{ font-size:8px; padding:4px 6px; letter-spacing:0; white-space:normal; line-height:1.15; }
    .md__ttl{ font-size:17px; }
  }
</style>
</head>

  const PASOS = [{"n": 1, "fase": "PUNTO DE PARTIDA", "c": "c1", "t": "Cazadores de sonidos", "d": "Primero vamos a recorrer la escuela en absoluto silencio, parando a escuchar en el patio, el pasillo y el comedor. ¿Qué se oye en cada lugar?, ¿de dónde viene?, ¿nos gusta o nos molesta?", "l": ["Caminamos en silencio y paramos en el patio, el pasillo, el comedor", "Anotamos en la bitácora qué escuchamos y qué nos hace sentir", "De vuelta en el aula, armamos entre todos una tabla con lo que escuchó cada grupo", "Dibujamos cuál creemos que es el lugar más ruidoso de la escuela"], "pos": "center 42%"}, {"n": 2, "fase": "INDAGACIÓN", "c": "c2", "t": "Mapeando la escuela", "d": "Después vamos a volver a esos mismos lugares, pero ahora con una app de sonómetro para medir cuánto ruido hay en cada uno. Con los datos de todos armamos un mapa sonoro de la escuela.", "l": ["Averiguamos qué es un decibel y cómo se mide el sonido", "Miramos el mapa de ruido de la Ciudad para ver cómo se representa", "Medimos nuestros espacios en hora de clase y en el recreo", "Armamos entre todo el grado un mapa de la escuela pintado por colores", "Comparamos: ¿lo que medimos coincide con lo que habíamos imaginado?"], "pos": "center 52%"}, {"n": 3, "fase": "INDAGACIÓN", "c": "c2", "t": "Laboratorio acústico: atrapando las ondas", "d": "¡Y hay más! Vamos a armar una caja con un parlante adentro y taparle la abertura con distintos materiales. ¿Todos hacen bajar el sonido de la misma manera? Lo averiguamos midiendo.", "l": ["Medimos la caja destapada, para saber de cuánto partimos", "Anotamos qué creemos que va a pasar con cada material", "Probamos uno por uno: madera, tela, goma espuma, cartón", "Comparamos los números: ¿acertamos?, ¿cuál nos sorprendió?"], "pos": "center 44%"}, {"n": 4, "fase": "PRODUCCIÓN", "c": "c3", "t": "Soluciones acústicas para la escuela", "d": "Con toda esa información vamos a convertirnos en diseñadores: cada grupo elige uno de los lugares más ruidosos del mapa, proyecta cómo mejorarlo y lo cuenta todo en un póster.", "l": ["Elegimos un espacio ruidoso y dibujamos cómo es", "Ubicamos ahí los materiales que creemos que van a ayudar", "Explicamos por qué elegimos esos y no otros", "Armamos el póster con el problema, los números y nuestra solución", "Escribimos recomendaciones para los que usan ese lugar"], "pos": "center 40%"}, {"n": 5, "fase": "EVALUACIÓN", "c": "c4", "t": "Comunicamos lo aprendido", "d": "Para terminar, vamos a mostrar nuestro mapa sonoro, los datos que medimos y las soluciones que diseñamos, para que toda la escuela conozca lo que investigamos.", "l": ["Nos repartimos quién cuenta cada parte", "Presentamos el mapa sonoro y explicamos cómo lo hicimos", "Mostramos nuestro póster y la mejora que proponemos", "Respondemos las preguntas del público", "Pensamos entre todos qué fue lo mejor del recorrido"], "pos": "center 30%"}];
  const COLOR = { c1:'#C957DB', c2:'#4272D7', c3:'#FFCC00', c4:'#42D789' };
  const TINTA = { c1:'#fff',    c2:'#fff',    c3:'#062B44', c4:'#062B44' };

  const fotos = document.getElementById('fotos');
  const steps = document.getElementById('steps');
  const ov = document.getElementById('ov');
  let abierto = null;

  PASOS.forEach((p, i) => {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img src="' + FOTOS['f' + p.n] + '" alt="Momento ' + p.n + ': ' + p.t + '" style="object-position:' + p.pos + '">';
    fotos.appendChild(fig);

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'st st--' + p.c;
    b.dataset.i = i;
    b.innerHTML =
      '<span class="st__n">' + p.n + '</span>' +
      '<span class="st__t">' + p.t + '</span>' +
      '<span class="st__cap">' + p.fase + '</span>';
    b.addEventListener('click', () => abrir(i));
    steps.appendChild(b);
  });

  function abrir(i){
    abierto = i;
    const p = PASOS[i];
    document.getElementById('mdTop').style.background = COLOR[p.c];
    const n = document.getElementById('mdN');
    n.textContent = p.n; n.style.background = COLOR[p.c]; n.style.color = TINTA[p.c];
    document.getElementById('mdTtl').textContent = p.t;
    const cap = document.getElementById('mdCap');
    cap.textContent = p.fase; cap.style.background = COLOR[p.c]; cap.style.color = TINTA[p.c];
    document.getElementById('mdD').textContent = p.d;
    document.getElementById('mdL').innerHTML = p.l.map(x => '<li>' + x + '</li>').join('');
    document.getElementById('mdStep').textContent = 'Momento ' + p.n + ' de ' + PASOS.length;
    document.getElementById('mdPrev').disabled = i === 0;
    document.getElementById('mdNext').disabled = i === PASOS.length - 1;
    ov.classList.add('is-on');
    document.getElementById('mdX').focus();
  }
  function cerrar(){
    ov.classList.remove('is-on');
    if (abierto != null){
      const b = steps.querySelector('button[data-i="' + abierto + '"]');
      if (b) b.focus();
    }
    abierto = null;
  }

  document.getElementById('mdX').addEventListener('click', cerrar);
  ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });
  document.getElementById('mdPrev').addEventListener('click', () => abrir(abierto - 1));
  document.getElementById('mdNext').addEventListener('click', () => abrir(abierto + 1));
  document.addEventListener('keydown', e => {
    if (!ov.classList.contains('is-on')) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowRight' && abierto < PASOS.length - 1) abrir(abierto + 1);
    if (e.key === 'ArrowLeft'  && abierto > 0) abrir(abierto - 1);
  });
})();
